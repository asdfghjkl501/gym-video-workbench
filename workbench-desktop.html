  /* ============================================================

  /* ---------- sidebar (固定在左侧，不随内容滚动) ---------- */

  /* quick add */
  .quick-grid { display:grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap:10px; }
  .qbtn { display:flex; align-items:center; gap:12px; padding:14px 15px; border:none; cursor:pointer; border-radius:6px;

  .qbtn:hover { border-color:var(--border-input); transform: translateY(-1px); box-shadow: var(--shadow-overlay); }

  .panel { background: var(--surface-card); border: 1px solid var(--border); border-radius: 6px; box-shadow: var(--shadow-card); padding:18px; }

  /* ---------- pinned tasks ---------- */

  .pin:hover { box-shadow: var(--shadow-overlay); transform: translateY(-1px); }

  .pin-b { flex:1; min-width:0; cursor:pointer; }
  .pin-t { font-size: 14.5px; font-weight: 700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .pin-t.done { text-decoration: line-through; color: var(--text-secondary); }
  .pin-m { font-size: 12px; color: var(--text-secondary); margin-top: 3px; }
  .pin-chk { flex:0 0 auto; width: 26px; height: 26px; border-radius: 8px; border: 1.6px solid var(--border-input);

  .pin-chk.on { background: var(--module-1); border-color: var(--module-1); }
  .pin-chk svg { opacity: 0; }

  .toolbar { display:flex; align-items:center; gap:10px; margin: 14px 0 12px; }

  input:focus, textarea:focus { border-color:var(--accent); box-shadow:0 0 0 3px var(--accent-muted); }
  textarea { resize:vertical; min-height:80px; }
  .search-box { position:relative; width: 240px; }
  .search-box svg { position:absolute; left:11px; top:50%; transform:translateY(-50%); color:var(--text-tertiary); cursor:pointer; transition:color .15s; }
  .search-box svg:hover { color:var(--accent); }
  .search-box input { padding-left:34px; }

  /* module hero header (per-type summary) */
  .hero { display:flex; align-items:center; gap: 13px; padding: 12px 20px; border-radius: 6px;
    background: var(--surface-card); border: 1px solid var(--border); box-shadow: var(--shadow-card); margin-bottom: 4px; position:relative; overflow:hidden; }
  .hero.has-cover { padding: 0; min-height: 96px; }
  .hero.has-cover .hero-bg { position:absolute; inset:0; background-size:cover; background-position:center; }
  .hero.has-cover .hero-bg::after { content:""; position:absolute; inset:0; background: linear-gradient(90deg, var(--surface-card) 28%, color-mix(in srgb, var(--surface-card) 60%, transparent) 55%, transparent 80%); }
  .hero.has-cover > .hero-inner { position:relative; z-index:1; padding: 12px 16px; display:flex; align-items:center; gap:13px; }
  .hero-ic { width: 40px; height: 40px; border-radius: 11px; display:grid; place-items:center; flex:0 0 auto; }
  .hero-tx { min-width:0; flex:1; }
  .hero-row { display:flex; align-items:baseline; gap: 9px; flex-wrap:wrap; }
  .hero-v { font-size: 20px; font-weight: 800; letter-spacing: -.02em; line-height: 1; }
  .hero-l { font-size: 13px; color: var(--text-secondary); }

  .rec .meta-tag { font-size:12px; font-weight:600; color:var(--text-secondary); }
  .rec .meta-tag::before { content:"·"; margin-right:6px; color:var(--text-tertiary); }
  .rec .meta-tag:first-child::before { display:none; }

  /* ---- layout variants (open-ended: add .rec-layout-xxx in <style> to extend) ---- */
  /* feature: 大图在上 + 标题 + 正文在下 */
  .rec.rec-layout-feature { padding:0; overflow:hidden; }
  .rec.rec-layout-feature .top { flex-direction:column; align-items:stretch; }
  .rec.rec-layout-feature .thumb { width:100%; height:160px; border-radius:0; margin:0; }
  .rec.rec-layout-feature .feat-title { padding:12px 16px 4px; font-size:15px; font-weight:700; color:var(--text); }
  .rec.rec-layout-feature .feat-body { padding:0 16px 14px; font-size:13px; color:var(--text-secondary); line-height:1.55; }
  /* quote: 大字居中 + 留白 */
  .rec.rec-layout-quote { padding:24px 20px; }
  .rec.rec-layout-quote .quote-text { font-size:18px; font-weight:600; line-height:1.6; color:var(--text); }
  .rec.rec-layout-quote .quote-meta { margin-top:10px; font-size:12px; color:var(--text-tertiary); }


  /* module two-column layout: 左记录 / 右统计侧栏 */
  .mod-layout { display:grid; grid-template-columns: 1fr 300px; gap: 16px; align-items: start; margin-top: 14px; }
  .mod-side { display:flex; flex-direction:column; gap: 12px; position: sticky; top: 16px; }
  .side-card { background:var(--surface-card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-card); padding:14px 15px; }
  .side-card .sh { display:flex; align-items:center; gap:8px; font-size:12.5px; font-weight:800; margin-bottom:10px; }
  .side-card .sh svg { color:var(--text-tertiary); }
  .stat-row { display:flex; align-items:center; justify-content:space-between; padding:6px 0; border-bottom:1px solid var(--border); }
  .stat-row:last-child { border-bottom:none; padding-bottom:0; }
  .stat-row .k { font-size:12.5px; color:var(--text-secondary); display:flex; align-items:center; gap:7px; }
  .stat-row .k .kd { width:8px; height:8px; border-radius:50%; flex:0 0 auto; }
  .stat-row .val { font-size:14px; font-weight:800; letter-spacing:-.01em; }
  /* 分类占比条 */
  .catbar { margin-top:4px; }
  .catbar .cbrow { display:flex; align-items:center; gap:9px; padding:7px 0; }
  .catbar .cbrow .cbn { font-size:12.5px; color:var(--text); width:52px; flex:0 0 auto; }
  .catbar .cbrow .cbt { flex:1; height:8px; border-radius:999px; background:var(--border); overflow:hidden; }
  .catbar .cbrow .cbt i { display:block; height:100%; border-radius:999px; }
  .catbar .cbrow .cbv { font-size:12px; color:var(--text-secondary); width:56px; text-align:right; flex:0 0 auto; }
  /* 大环形（进度/打卡侧栏） */
  .side-ring { display:flex; flex-direction:column; align-items:center; gap:8px; padding:6px 0 2px; }
  .side-ring .dial { position:relative; width:120px; height:120px; }
  .side-ring .dial svg.gauge { transform: rotate(-90deg); width:120px; height:120px; }
  .side-ring .dial .mid { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:2px; }
  .side-ring .big { font-size:26px; font-weight:800; letter-spacing:-.02em; }
  .side-ring .cap { font-size:12px; color:var(--text-secondary); }

  /* finance summary minis */
  .mod-summary { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; margin-bottom: 4px; }
  .mini { background:var(--surface-card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-card); padding:12px 14px; }
  .mini .l { font-size:12px; color:var(--text-secondary); }
  .mini .v { font-size:19px; font-weight:800; margin-top:3px; letter-spacing:-.02em; }

  /* record list — 长方形卡片列表 */
  .rec-grid { display:flex; flex-direction:column; gap:10px; }
  .rec { position:relative; background:var(--surface-card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-card); padding:16px 20px; transition: border-color .12s, box-shadow .15s; min-height:72px; }
  .rec:hover { border-color: var(--border-input); box-shadow: var(--shadow-overlay); }
  .rec .top { display:flex; align-items:center; gap:12px; }
  .rec .chk { flex:0 0 auto; width:23px; height:23px; border-radius:7px; border:1.6px solid var(--border-input); display:grid; place-items:center;
    cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition: all .15s; }
  .rec .chk.on { background:var(--module-1); border-color:var(--module-1); }
  .rec .chk svg { opacity:0; } .rec .chk.on svg { opacity:1; }
  .rec .body { flex:1; min-width:0; cursor:pointer; display:flex; align-items:center; gap:11px; flex-wrap:wrap; }
  .rec .rname { font-weight:700; font-size:14.5px; letter-spacing:-.01em; flex:0 1 auto; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; max-width:100%; }
  .rec .rname.done { text-decoration:line-through; color:var(--text-secondary); }
  .rec .rmeta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; }
  .rec .rnote { flex:1 0 100%; color:var(--text-secondary); font-size:13px; margin-top:8px; white-space:pre-wrap; line-height:1.65;
    overflow:hidden; display:-webkit-box; -webkit-box-orient:vertical; -webkit-line-clamp:3; max-height:5em; }
  .badge { display:inline-flex; align-items:center; gap:5px; padding:2px 9px; border-radius:999px; font-size:11.5px; font-weight:700; }
  .badge .dot { width:6px; height:6px; border-radius:50%; background:currentColor; }
  .rec .acts { position:absolute; top:50%; right:8px; transform:translateY(-50%); display:flex; gap:1px; opacity:0; transition: opacity .15s; background:var(--surface-card); border-radius:8px; padding:2px; }
  .rec:hover .acts { opacity:1; }
  .rec .acts button { border:none; background:transparent; color:var(--text-tertiary); cursor:pointer;
    width:28px; height:28px; border-radius:7px; display:grid; place-items:center; transition: all .15s; }
  .rec .pin-btn:hover { background:var(--surface-nested); color:var(--module-3); }
  .rec .pin-btn.on { color:var(--module-3); opacity:1; } .rec .pin-btn.on svg { fill: var(--module-3); }
  .rec:has(.pin-btn.on) .acts { opacity:1; }
  .rec .del:hover { background:var(--danger-muted); color:var(--danger); }
  .rec .batch-chk { width:20px; height:20px; border-radius:6px; border:2px solid var(--border); display:grid; place-items:center; cursor:pointer; transition:all .15s; color:transparent; }
  .rec .batch-chk:hover { border-color:var(--accent); }
  .rec .batch-chk.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .rec:has(.batch-chk.on) .acts { opacity:1; }

  /* 批量操作工具栏 */
  .batch-bar { display:flex; align-items:center; gap:8px; padding:8px 14px; margin:0 0 12px; border-radius:10px; background:var(--surface-nested); border:1px solid var(--border); }
  .batch-sel-all { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; font-weight:600; color:var(--text-primary); user-select:none; }
  .chk-box { width:18px; height:18px; border-radius:5px; border:2px solid var(--border); display:grid; place-items:center; transition:all .15s; color:transparent; }
  .chk-box.on { background:var(--accent); border-color:var(--accent); color:#fff; }
  .sort-wrap { display:flex; align-items:center; gap:6px; }
  .sort-label { font-size:12px; color:var(--text-secondary); display:inline-flex; align-items:center; gap:3px; }
  .sort-seg { display:flex; gap:2px; }
  .sort-seg .opt { font-size:11.5px; padding:3px 8px; border-radius:6px; cursor:pointer; color:var(--text-secondary); transition:all .15s; }
  .sort-seg .opt:hover { background:var(--surface-card); }
  .sort-seg .opt.on { background:var(--accent); color:#fff; font-weight:600; }
  .rec .pbar { flex:1; min-width:80px; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .rec .pbar i { display:block; height:100%; border-radius:999px; }
  .rec .amt { font-size:15px; font-weight:800; letter-spacing:-.02em; white-space:nowrap; margin-left:auto; }
  .rec .amt.exp { color:var(--danger); } .rec .amt.inc { color:var(--module-1); }
  .rec .streak { font-size:11.5px; color:var(--module-3); font-weight:700; display:inline-flex; align-items:center; gap:4px; }
  .rec .rdate { color:var(--text-secondary); font-size:11.5px; margin-left:auto; white-space:nowrap; }
  .empty { text-align:center; color:var(--text-secondary); padding:50px 20px; }
  .empty .e { display:inline-grid; place-items:center; width:56px; height:56px; border-radius:6px; background:var(--surface-card); border:1px solid var(--border); color:var(--text-tertiary); margin-bottom:12px; }

  /* ---------- modal ---------- */
  .overlay { position:fixed; inset:0; background:rgba(15,23,42,0.35); backdrop-filter: blur(4px); z-index:60;
    display:flex; align-items:center; justify-content:center; animation: fade .16s ease; }
  @keyframes fade { from { opacity:0; } }
  .modal { background:var(--surface-card); border:1px solid var(--border); border-radius:var(--radius-sheet); padding:26px; width:480px; max-width:92vw; max-height:90vh; overflow-y:auto;
    box-shadow:0 22px 60px rgba(0,0,0,0.12); animation: pop .18s cubic-bezier(.2,.8,.3,1); }
  @keyframes pop { from { transform: translateY(10px) scale(.98); opacity:0; } }
  .modal h3 { font-size:19px; font-weight:800; letter-spacing:-.01em; }
  .modal .sub { color:var(--text-secondary); font-size:13px; margin:5px 0 18px; }
  .field { margin-bottom:14px; }
  .field label { display:block; color:var(--text-secondary); font-size:13px; margin-bottom:6px; }
  .frow { display:flex; gap:12px; } .frow .field { flex:1; }
  .seg { display:flex; gap:8px; flex-wrap:wrap; }
  .seg .opt { flex:1; min-width:64px; text-align:center; padding:10px; border-radius:11px; border:1px solid var(--border-input);
    cursor:pointer; font-size:13px; font-weight:600; color:var(--text-secondary); background:var(--surface-nested); transition: all .12s; }
  .seg .opt.on { background:var(--accent); border-color:var(--accent); color:var(--on-accent); }
  .modal-actions { display:flex; align-items:center; gap:10px; margin-top:22px; }
  .link-danger { color:var(--danger); background:none; border:none; font-size:14px; font-weight:600; cursor:pointer; padding:8px 10px; border-radius:8px; }
  .link-danger:hover { background:var(--danger-muted); }

  /* 数据管理弹窗 */
  .dm-section { margin-bottom:18px; }
  .dm-label { font-size:12px; font-weight:700; color:var(--text-secondary); margin-bottom:8px; text-transform:uppercase; letter-spacing:.05em; }
  .dm-bar-wrap { height:8px; border-radius:999px; background:var(--border); overflow:hidden; margin-bottom:6px; }
  .dm-bar { height:100%; border-radius:999px; background:linear-gradient(90deg, var(--module-1), var(--accent)); transition:width .3s; }
  .dm-bar-info { display:flex; justify-content:space-between; font-size:11.5px; color:var(--text-secondary); margin-bottom:12px; }
  .dm-stats { display:flex; gap:16px; }
  .dm-stat { text-align:center; flex:1; padding:8px; border-radius:10px; background:var(--surface-nested); }
  .dm-stat-v { font-size:20px; font-weight:800; color:var(--accent); }
  .dm-stat-l { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .dm-warn { font-size:11.5px; color:var(--danger); margin-top:6px; }

  /* ============================================================
     BENTO DASHBOARD — 首页复杂网格布局（墨色中性 · 高密度）
     ============================================================ */
  .bento { display:grid; grid-template-columns: repeat(12, 1fr); gap:16px; align-items:stretch; }
  .bento > * { min-width:0; }   /* 允许网格轨道收窄，避免窄屏内容溢出 */
  .b3{grid-column:span 3} .b4{grid-column:span 4} .b5{grid-column:span 5}
  .b6{grid-column:span 6} .b7{grid-column:span 7} .b8{grid-column:span 8} .b12{grid-column:span 12}

  /* 分组标题（EN 副标题 + 中文标题 + 分隔线） */
  .sec-grp { display:flex; align-items:center; gap:12px; margin:26px 2px 14px; }
  .sec-grp .bar { width:4px; height:19px; border-radius:2px; background:var(--accent); flex:0 0 auto; }
  .sec-grp .zh { font-size:16px; font-weight:800; letter-spacing:-.02em; }
  .sec-grp .en { font-size:10.5px; font-weight:800; letter-spacing:.15em; color:var(--text-tertiary); }
  .sec-grp .line { flex:1; height:1px; background:var(--border); }

  /* 通用瓷砖 */
  .tile { background:var(--surface-card); border:1px solid var(--border); border-radius:6px; box-shadow:var(--shadow-card);
    padding:18px 20px; display:flex; flex-direction:column; overflow:hidden; min-height:320px; }
  .tile-h { display:flex; align-items:center; gap:9px; margin-bottom:14px; }
  .tile-h .tic { color:var(--text-tertiary); display:flex; }
  .tile-h .en { font-size:9.5px; font-weight:800; letter-spacing:.14em; color:var(--text-tertiary); line-height:1; }
  .tile-h .zh { font-size:14px; font-weight:800; letter-spacing:-.01em; line-height:1.15; }
  .tile-h .tt { display:flex; flex-direction:column; gap:3px; }
  .tile-h .r { margin-left:auto; font-size:12px; color:var(--text-secondary); font-weight:700; }

  /* 整体情况瓷砖 */
  .ov2-body { display:grid; grid-template-columns:1fr 300px; gap:22px; flex:1; align-items:stretch; }
  .ov2-body .rings { align-content:center; }
  .ov2-side { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background: var(--surface-gradient);
    box-shadow:var(--shadow-overlay);
    padding:20px; display:flex; flex-direction:column; justify-content:space-between; gap:12px; }
  .ov2-stat { position:relative; z-index:1; display:flex; align-items:center; gap:13px; cursor:pointer;
    padding:12px 4px; border-radius:var(--radius-control); transition:background .15s; }
  .ov2-stat:hover { background: var(--surface-nested); }
  .ov2-stat + .ov2-stat { border-top:1px solid var(--border); }
  .ov2-stat .s-ic { width:40px; height:40px; border-radius:10px; display:grid; place-items:center; flex:0 0 auto;
    background: var(--accent-muted); color: var(--accent); }
  .ov2-stat .s-tx { min-width:0; }
  .ov2-stat .s-v { font-size:24px; font-weight:800; letter-spacing:-.03em; line-height:1.05; color:var(--text);
    font-variant-numeric:tabular-nums; }
  .ov2-stat .s-l { font-size:11.5px; color:var(--text-secondary); margin-top:3px; }

  /* 大时钟卡（三丽鸥·粉紫梦幻） */
  .clock-card { position:relative; overflow:hidden; border-radius:var(--radius-card);
    background: var(--surface-gradient); color:var(--text);
    padding:26px 28px; box-shadow:var(--shadow-overlay); display:flex; flex-direction:column; justify-content:space-between; min-height:320px; }
  .clock-card > * { position:relative; z-index:1; }
  .clock-card .hi { font-size:24px; font-weight:700; letter-spacing:-.02em; }
  .clock-card .sub { font-size:12.5px; color: var(--text-secondary); margin-top:5px; max-width:230px; line-height:1.5; }
  .clock-card .clk { font-size:clamp(38px,4.4vw,50px); font-weight:700; letter-spacing:.01em; font-variant-numeric:tabular-nums; line-height:1; color: var(--accent); }
  .clock-card .cmeta { display:flex; align-items:center; gap:10px; margin-top:9px; font-size:12px; color: var(--text-secondary); }
  .clock-card .cmeta .dot { width:4px; height:4px; border-radius:50%; background:currentColor; }

  /* 焦点/统计瓷砖 */
  .focus-list { display:flex; flex-direction:column; gap:9px; flex:1; min-height:0; max-height:240px; overflow-y:auto; padding-right:4px; }
  .book-list { flex:1; min-height:0; max-height:240px; overflow-y:auto; padding-right:4px; }
  .settings-cat-list { flex:1; min-height:0; max-height:240px; overflow-y:auto; padding-right:4px; }

  /* 自定义滚动条 */
  .focus-list::-webkit-scrollbar, .book-list::-webkit-scrollbar, .settings-cat-list::-webkit-scrollbar,
  .filter-bar ::-webkit-scrollbar { width:5px; }
  .focus-list::-webkit-scrollbar-track, .book-list::-webkit-scrollbar-track, .settings-cat-list::-webkit-scrollbar-track { background:transparent; }
  .focus-list::-webkit-scrollbar-thumb, .book-list::-webkit-scrollbar-thumb, .settings-cat-list::-webkit-scrollbar-thumb { background: var(--scrollbar-thumb); border-radius:999px; }
  .focus-list::-webkit-scrollbar-thumb:hover, .book-list::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
  .focus-row { display:flex; align-items:center; gap:11px; }
  .focus-row .fic { width:30px; height:30px; border-radius:9px; display:grid; place-items:center; flex:0 0 auto;
    background:var(--surface-nested); border:1px solid var(--border); }
  .focus-row .ft { flex:1; min-width:0; cursor:pointer; }
  .focus-row .fn { font-size:13.5px; font-weight:700; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .focus-row .fn.done { text-decoration:line-through; color:var(--text-secondary); }
  .focus-row .fm { font-size:11px; color:var(--text-secondary); margin-top:2px; }
  .focus-empty { color:var(--text-secondary); font-size:12.5px; line-height:1.7; padding:6px 0; }
  .stat-big { font-size:32px; font-weight:800; letter-spacing:-.03em; line-height:1; }
  .stat-big small { font-size:15px; color:var(--text-secondary); font-weight:700; letter-spacing:0; }
  .stat-cap { font-size:12px; color:var(--text-secondary); margin-top:7px; }
  .prog-line { height:7px; border-radius:999px; background:var(--border); overflow:hidden; margin-top:auto; }
  .prog-line i { display:block; height:100%; border-radius:999px; }

  /* 习惯追踪周网格表 */
  .habit-tb { width:100%; border-collapse:collapse; }
  .habit-tb th { font-size:10.5px; font-weight:700; color:var(--text-tertiary); padding:0 0 9px; text-align:center; }
  .habit-tb th.hh { text-align:left; }
  .habit-tb th.hr { text-align:right; }
  .habit-tb td { padding:5px 0; text-align:center; vertical-align:middle; }
  .habit-tb td.hn { text-align:left; font-size:12.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:118px; }
  .habit-tb td.hn .hdot { display:inline-block; width:7px; height:7px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .habit-tb td.hrate { text-align:right; font-size:12.5px; font-weight:800; letter-spacing:-.02em; }
  .hcell { display:inline-grid; place-items:center; width:22px; height:22px; border-radius:7px; color:var(--on-accent); cursor:pointer; transition:transform .12s; }
  .hcell:hover { transform:scale(1.12); }
  .hcell.on { background:var(--module-1); }
  .hcell.off { background:var(--surface-nested); border:1px solid var(--border); }
  .hcell svg { opacity:0; } .hcell.on svg { opacity:1; }
  .habit-tb .tdcol { background:var(--accent-muted); }
  .habit-tb col.todaycol { background:var(--accent-muted); }

  /* 待办清单（仪表盘式） */
  .tk-head { display:flex; align-items:center; gap:10px; margin-bottom:8px; }
  .tk-head .pct { font-size:22px; font-weight:800; letter-spacing:-.03em; }
  .tk-head .cnt { font-size:12px; color:var(--text-secondary); font-weight:700; }
  .tk-head .bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }
  .tk-head .bar i { display:block; height:100%; border-radius:999px; background:var(--accent); }
  .tk-list { display:flex; flex-direction:column; }
  .tk-row { display:flex; align-items:center; gap:11px; padding:8px 0; border-bottom:1px solid var(--border); }
  .tk-row:last-child { border-bottom:none; }
  .tk-chk { flex:0 0 auto; width:20px; height:20px; border-radius:6px; border:1.6px solid var(--border-input);
    display:grid; place-items:center; cursor:pointer; background:var(--surface-card); color:var(--on-accent); transition:all .15s; }
  .tk-chk.on { background:var(--module-1); border-color:var(--module-1); }
  .tk-chk svg { opacity:0; } .tk-chk.on svg { opacity:1; }
  .tk-name { flex:1; min-width:0; font-size:13.5px; font-weight:600; cursor:pointer; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tk-name.done { text-decoration:line-through; color:var(--text-secondary); }

  /* 番茄钟（三丽鸥·薄荷蓝梦） */
  .pomo { position:relative; overflow:hidden; border-radius:var(--radius-card); text-align:center;
    background: var(--surface-gradient); color:var(--text); padding:22px 20px; box-shadow:var(--shadow-overlay);
    display:flex; flex-direction:column; }
  .pomo > * { position:relative; z-index:1; }
  .pomo .pen { font-size:9.5px; font-weight:700; letter-spacing:.16em; color: var(--text-tertiary); }
  .pomo .pzh { font-size:13px; font-weight:700; margin-top:3px; }
  .pomo .ring-wrap { position:relative; width:150px; height:150px; margin:14px auto 12px; }
  .pomo .ring-wrap svg { transform:rotate(-90deg); }
  .pomo .ptime { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px; }
  .pomo .ptime .t { font-size:32px; font-weight:700; font-variant-numeric:tabular-nums; letter-spacing:.01em; color: var(--accent); }
  .pomo .ptime .s { font-size:11px; color: var(--text-secondary); }
  .pomo .pctl { display:flex; gap:8px; justify-content:center; margin-bottom:14px; }
  .pomo .pctl button { border:1px solid var(--border); background:var(--surface-nested); color:var(--text-secondary);
    border-radius:10px; padding:8px 16px; font-size:13px; font-weight:500; cursor:pointer; transition:all .15s; }
  .pomo .pctl button:hover { background:var(--surface-card); }

    display:grid; place-items:center; color:var(--on-accent); }

  /* 本周目标 / 通用目标条 */
  .goal-list { display:flex; flex-direction:column; gap:13px; }

  .pipeline-flow { display:flex; align-items:center; gap:4px; padding:6px 0; flex-wrap:wrap; }

  /* 本周排期 mini */

  .sdm-head { font-size:11px; color:var(--text-secondary); margin-bottom:4px; }
  .sdm-body { font-size:18px; font-weight:700; color:var(--text-primary); min-height:22px; }

  /* 设置概览看板 */

  .ls-item { text-align:center; }

  .settings-cat-row { display:flex; align-items:center; gap:8px; font-size:12px; }
  .lc-name { width:80px; flex:0 0 auto; color:var(--text-primary); font-weight:500; }
  .lc-bar { flex:1; height:6px; border-radius:999px; background:var(--border); overflow:hidden; }

  .lc-val { font-size:11.5px; color:var(--text-secondary); font-weight:600; }

  .hidden { display:none !important; }

  /* 筛选栏 */
  .filter-bar { display:flex; align-items:center; gap:12px; padding:8px 0; margin-bottom:4px; flex-wrap:wrap; }
  .filter-label { font-size:12px; color:var(--text-secondary); font-weight:600; }
  .filter-date { display:flex; align-items:center; gap:6px; }
  .filter-date input[type="date"] { padding:5px 8px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; color:var(--text-primary); background:var(--surface-nested); width:130px; }
  .filter-date input[type="date"]:focus { outline:none; border-color:var(--accent); }
  .filter-sep { color:var(--text-tertiary); font-size:12px; }
  .filter-sel { padding:5px 8px; border:1px solid var(--border); border-radius:8px; font-size:12px; font-family:inherit; color:var(--text-primary); background:var(--surface-nested); cursor:pointer; }
  .filter-sel:focus { outline:none; border-color:var(--accent); }
  .filter-clear { padding:5px 10px; border:1px solid var(--danger); border-radius:8px; background:var(--danger-muted); color:var(--danger); font-size:12px; font-family:inherit; cursor:pointer; display:flex; align-items:center; gap:4px; }

  /* 侧边统计栏可交互 */
  .js-stat-filter, .js-stat-today { cursor:pointer; transition:background .15s; border-radius:6px; }
  .js-stat-filter:hover, .js-stat-today:hover { background:var(--surface-nested); }

  /* ========== 每日排期视图 ========== */
  .sched-toolbar { display:flex; align-items:center; gap:10px; margin-bottom:18px; flex-wrap:wrap; }
  .sched-nav-btn { width:36px; height:36px; border-radius:8px; border:1px solid var(--border); background:var(--surface-card); display:grid; place-items:center; cursor:pointer; color:var(--text-secondary); transition:all .2s; backdrop-filter:blur(var(--blur)); }
  .sched-nav-btn:hover { background:var(--surface-nested); color:var(--text-primary); }
  .sched-week-label { font-size:16px; font-weight:800; letter-spacing:-.01em; color:var(--text-primary); min-width:180px; text-align:center; }
  .sched-view-toggle { display:flex; gap:4px; margin-left:auto; }
  .sched-view-toggle .vt-btn { padding:6px 14px; border-radius:6px; font-size:12.5px; font-weight:600; border:1px solid var(--border); background:var(--surface-card); cursor:pointer; color:var(--text-secondary); transition:all .2s; backdrop-filter:blur(var(--blur)); }
  .sched-view-toggle .vt-btn.on { background:var(--accent); color:#fff; border-color:transparent; }

  /* 周视图 */
  .sched-week { display:grid; grid-template-columns:repeat(7,1fr); gap:10px; }
  .sched-day-col { min-height:320px; }
  .sched-day-head { display:flex; align-items:center; justify-content:space-between; padding:8px 10px; border-radius:8px 8px 0 0; background:var(--surface-nested); backdrop-filter:blur(var(--blur)); }
  .sched-day-head .dw { font-size:12px; font-weight:700; color:var(--text-secondary); }
  .sched-day-head .dd { font-size:15px; font-weight:800; color:var(--text-primary); }

  .sched-day-head.today .dw, .sched-day-head.today .dd { color:#fff; }
  .sched-day-body { padding:6px; background:var(--surface-card); border:1px solid var(--border); border-top:none; border-radius:0 0 8px 8px; min-height:280px; backdrop-filter:blur(var(--blur)); }

  /* 任务卡片 */
  .task-card { background:var(--surface-nested); border:1px solid var(--border); border-radius:6px; padding:10px 12px; margin-bottom:8px; cursor:pointer; transition:all .2s; position:relative; }

  .task-card .tc-topic { font-size:13px; font-weight:700; color:var(--text-primary); line-height:1.4; margin-bottom:4px; }
  .task-card .tc-summary { font-size:11.5px; color:var(--text-tertiary); line-height:1.5; margin-bottom:6px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .task-card .tc-badges { display:flex; gap:4px; flex-wrap:wrap; }

  .tc-badge.st-gen { background:rgba(59,130,246,.12); color:#2563eb; }
  .tc-badge.st-ready { background:rgba(168,85,247,.12); color:#7c3aed; }
  .tc-badge.st-pub { background:rgba(34,197,94,.12); color:#16a34a; }

  .task-card .tc-del { position:absolute; top:6px; right:6px; width:20px; height:20px; border-radius:4px; display:none; place-items:center; color:var(--text-tertiary); cursor:pointer; }
  .task-card:hover .tc-del { display:grid; }
  .task-card .tc-del:hover { color:var(--danger); }
  .task-card .tc-view-script { margin-top:6px; padding:3px 8px; border-radius:10px; border:1px solid var(--border); background: var(--surface-nested); color:var(--accent); font-size:10.5px; font-weight:500; cursor:pointer; display:inline-flex; align-items:center; gap:3px; transition:all .2s; }
  .task-card .tc-view-script:hover { background: var(--accent-muted); border-color: var(--accent); }
  .sched-add-btn { width:100%; padding:8px; border:1px dashed var(--border); border-radius:6px; background:transparent; color:var(--text-tertiary); font-size:12px; cursor:pointer; transition:all .2s; }
  .sched-add-btn:hover { border-color:var(--accent); color:var(--accent); background:var(--accent-muted); }

  /* 列表视图 */
  .sched-list { display:flex; flex-direction:column; gap:0; }
  .sched-list-row { display:flex; align-items:flex-start; gap:14px; padding:14px 16px; border-bottom:1px solid var(--border); cursor:pointer; transition:background .2s; }

  .sched-list-row .sl-body { flex:1; min-width:0; }
  .sched-list-row .sl-topic { font-size:14px; font-weight:700; color:var(--text-primary); margin-bottom:4px; }
  .sched-list-row .sl-summary { font-size:12px; color:var(--text-tertiary); line-height:1.5; margin-bottom:6px; }
  .sched-list-row .sl-badges { display:flex; gap:4px; flex-wrap:wrap; }

  .rec-action {
    display:inline-flex; align-items:center; gap:4px;
    padding:3px 10px; border-radius:5px; font-size:11px; font-weight:600;

  .topic-funnel { display:flex; flex-direction:column; gap:8px; }

  /* ============================================================
     主题增强 — SaaS 克制风格
     ============================================================ */

  .acct-status.active { background: var(--accent-muted); color: var(--accent); border-color: transparent; }

</style>

        {id:122,title:"【今日爆款#13】深蹲到底蹲多深？90%的人都蹲错了",mood:"今日爆款",date:isoToday(),content:"【平台】抖音/B站\n【爆款类型】知识干货 + 动作纠错\n【核心钩子】深蹲不是越深越好，蹲错伤膝盖蹲对长翘臀\n【热度分析】动作纠错类内容完播率高，90%的人蹲错了制造焦虑感和求知欲\n【可复用逻辑】健身房可做动作纠错系列：深蹲/硬拉/卧推，每期展示错误→正确对比，引导到店找私教调整"},
        {id:123,title:"【今日爆款#14】健身房社交货币：穿什么去健身比穿什么约会还讲究",mood:"今日爆款",date:isoToday(),content:"【平台】小红书\n【爆款类型】生活方式 + 种草清单\n【核心钩子】2026年健身穿搭已经成为社交货币，运动品牌比快时尚更卷\n【热度分析】健身穿搭是小红书高互动品类，天然带种草属性\n【可复用逻辑】健身房可做运动穿搭推荐+场馆打卡内容，展示更衣室环境和品牌联名，提升到店打卡动机"},
        {id:124,title:"【今日爆款#15】晚上8点健身房最挤：打工人健身时段大数据",mood:"今日爆款",date:isoToday(),content:"【平台】头条/抖音\n【爆款类型】数据洞察 + 场景共鸣\n【核心钩子】全国健身房晚间高峰8-9点排队等器械，午间12-13点空置率最高\n【热度分析】时段数据引发打工人共鸣，排队等器械是普遍痛点\n【可复用逻辑】健身房可推错峰优惠卡（午间特价），用数据引导用户分流，提升场地利用率"},
        {id:125,title:"反差对比：90天前 vs 90天后，同一个健身房同一个教练",mood:"反差对比型",date:isoToday(),content:"【钩子】90天前体脂28%驼背圆肩，90天后体脂18%直角肩天鹅颈\n【叙事结构】对比开场(前/后照片3秒) → 拆解3个关键转变 → 方法+教练作用 → 总结\n【痛点】练了没效果、不知道怎么练、坚持不下来\n【卖点植入】关键转变环节自然带出：私教课纠正动作、系统训练计划、饮食指导三合一\n【结尾引导】想知道你的90天能变成什么样？私信我定制计划\n【可套用模板】对比画面3秒 → 拆解3个转变8秒 → 方法+卖点10秒 → 互动转化9秒"},
        {id:126,title:"反差对比：自己练3年 vs 请私教3个月，结果差距惊人",mood:"反差对比型",date:isoToday(),content:"【钩子】自己瞎练3年没什么变化，请私教3个月像换了个身体\n【叙事结构】对比开场 → 自己练的误区拆解 → 私教带来的改变 → 总结推荐\n【痛点】自己练没效果、不知道要不要请私教、怕私教不值\n【卖点植入】在私教带来的改变环节展示：动作纠正、计划定制、饮食管理、进度追踪\n【结尾引导】私信我体验一节私教课，感受专业指导的差距\n【可套用模板】对比3秒 → 误区拆解10秒 → 私教价值+卖点12秒 → 转化5秒"},
        {id:127,title:"避坑科普：健身房办卡前必须问的5个问题",mood:"避坑科普型",date:isoToday(),content:"【钩子】办健身卡之前，这5个问题不问清楚等于扔钱\n【叙事结构】身份背书 → 5个必问问题逐条列举 → 总结提醒 → 转化引导\n【痛点】怕被坑钱、怕隐形消费、怕退卡难\n【卖点植入】5个问题中自然植入本店优势：无隐形消费/可试课后办卡/退卡政策透明\n【结尾引导】想体验再决定？私信我预约免费体验课\n【评论区引导】置顶评论放办卡避坑清单领取方式\n【可套用模板】身份钩子3秒 → 5个避坑点+卖点18秒 → 互动6秒 → 转化3秒"},
        {id:128,title:"避坑科普：5个健身房最常见的错误动作，你中了几个",mood:"避坑科普型",date:isoToday(),content:"【钩子】健身房里90%的人都在用错误姿势练，越练越伤\n【叙事结构】钩子开场 → 5个错误动作逐个展示(错误vs正确) → 总结提醒 → 转化引导\n【痛点】练了没效果、关节疼痛、怕受伤\n【卖点植入】在错误纠正环节自然带出：动作做不准建议找私教指导，避免受伤\n【结尾引导】想知道自己的动作对不对？来店里做一次免费动作评估\n【可套用模板】钩子3秒 → 5个错误对比15秒 → 总结+转化7秒 → 互动5秒"},

        {id:131,title:"知识干货：蛋白质吃多了反而长胖？增肌减脂蛋白质摄入完整指南",mood:"知识干货型",date:isoToday(),content:"【钩子】蛋白质不是越多越好，吃多了照样长胖\n【叙事结构】抛出问题 → 给出答案(蛋白质需求计算) → 拆解原理(吸收上限) → 实操建议\n【痛点】不知道吃多少、吃了没效果、怕吃多长胖\n【卖点植入】实操建议环节轻植入：需要系统训练+饮食方案可以来健身房做体测咨询\n【结尾引导】觉得有用收藏 / 想定制饮食+训练方案私信我\n【可套用模板】问题钩子3秒 → 答案+原理12秒 → 实操+轻植入10秒 → 收藏5秒"},
        {id:132,title:"挑战打卡：30天健身房打卡Day1-30完整记录，体脂从25%到18%",mood:"挑战打卡型",date:isoToday(),content:"【钩子】30天健身房打卡完整记录，体脂从25%降到18%\n【叙事结构】宣布挑战目标 → 30天分集记录 → 每周阶段性变化 → 总结复盘\n【痛点】坚持难、看不到效果、需要陪伴感\n【卖点植入】过程中自然展示健身房环境、教练指导、训练氛围，用真实记录代替硬广\n【结尾引导】关注看完整30天记录 / 想一起挑战私信我\n【可套用模板】挑战目标3秒 → 当日训练15秒 → 阶段变化7秒 → 关注5秒"},

        {id:411,title:"【今日推荐】别瞎练胸口播台词",mood:"今日推荐",date:isoToday(),pinned:true,content:"一根拉力绳收藏超10万，但健身房里的胸肌器械你却从来不用？\n今天告诉你差距在哪。\n\n拉力绳确实方便，但它的阻力是递增的，拉伸越远越重，动作前半段几乎没有刺激。\n而健身房的固定器械，阻力曲线是恒定的，全程都能给胸肌施压。\n更关键的是，健身房有上斜、下斜、平板三种角度的卧推架，能分别练到上胸、下胸、中胸，拉力绳很难做到这种精准分离。\n\n如果你真的想把胸肌练出立体感，不是靠一个器械就能搞定的。\n你需要的是一套系统的训练方案。\n这正是私教课的核心价值。\n\n想系统练胸的朋友，评论区扣胸肌，我发你一份健身房胸肌五日训练计划。"},

        {id:401,title:"办卡避坑口播台词",mood:"办卡避坑",date:isoToday(),content:"第一次办健身卡？先别急着掏钱。\n这3件事，销售不会主动告诉你。\n\n第一，别只看月卡价格。\n年卡折算下来一个月才几十块，比月卡划算太多。\n但前提是，你确定自己能坚持。\n\n第二，问清楚有没有隐形消费。\n储物柜、团课、淋浴，这些可能都要单独收费。\n\n第三，最重要的一点。\n别一上来就买大课包。\n先体验一两节私教课，看看教练水平适不适合你，再决定要不要长期跟。\n\n你办卡时踩过什么坑？评论区聊聊。\n想先体验一节私教课？私信我体验课，发你一节免费试练。"},

/* 本周（周一起）7 天的 ISO 日期 */
function weekDates(){
  const n=new Date(); const dow=(n.getDay()+6)%7; const mon=new Date(n); mon.setDate(n.getDate()-dow);
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); arr.push(d.toISOString().slice(0,10)); }
  return arr;
}
function weekNum(){ const n=new Date(); const s=new Date(n.getFullYear(),0,1);
  return Math.ceil(((n-s)/86400000 + s.getDay()+1)/7); }

/* ---------- ring svg ---------- */
function ringSVG(pct, color){
  const r=25, c=2*Math.PI*r, off=c*(1-Math.min(100,pct)/100);
  return `<svg class="gauge" viewBox="0 0 60 60"><circle cx="30" cy="30" r="${r}" fill="none" stroke="var(--border)" stroke-width="5.5"/>
    <circle cx="30" cy="30" r="${r}" fill="none" stroke="${color}" stroke-width="5.5" stroke-linecap="round"
      stroke-dasharray="${c}" stroke-dashoffset="${off}"/></svg>`;
}
function trendSVG(series){
  const w=560, h=170, padX=12, padTop=16, padBot=22;
  const max=Math.max(...series), min=Math.min(...series);
  const rng=(max-min)||1;
  const innerW=w-2*padX, innerH=h-padTop-padBot;
  const pts=series.map((v,i)=>{
    const x=padX+innerW*i/(series.length-1);
    const y=padTop+innerH*(1-(v-min)/rng);
    return [x,y];
  });
  const line=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=line+` L ${padX+innerW} ${h-padBot} L ${padX} ${h-padBot} Z`;
  const dots=pts.map(p=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="3.2" fill="var(--surface-card)" stroke="var(--module-2)" stroke-width="2"/>`).join('');
  return `<svg class="trend-svg" viewBox="0 0 ${w} ${h}" preserveAspectRatio="xMidYMid meet">
    <defs><linearGradient id="tg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="var(--module-2)" stop-opacity=".22"/><stop offset="1" stop-color="var(--module-2)" stop-opacity="0"/></linearGradient></defs>
    <path d="${area}" fill="url(#tg)"/><path d="${line}" fill="none" stroke="var(--module-2)" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>${dots}</svg>`;
}

      <div class="pipe-num" style="color:${s.color}">${s.count}</div>
      <div class="pipe-label">${s.label}</div>
      <div class="pipe-bar"><i style="width:${pct}%;background:${s.color}"></i></div>
    </div>${arrow}`;
  }).join("");
  return `<div class="tile b12"><div class="tile-h"><span class="tic">${icon("arrow",16,2.2)}</span><div class="tt"><span class="en">CONTENT PIPELINE</span><span class="zh">内容流水线</span></div><span class="r">爆款 → 选题 → 脚本 → 排期 → 发布</span></div>
    <div class="pipeline-flow">${cells}</div></div>`;
}

/* 本周排期概览 */
function schedOverviewTileHTML(){
  const tasks=data.schedule||[];
  const wk=weekDates();
  const wkTasks=tasks.filter(t=>wk.includes(t.date));
  const byStatus={edit:0,gen:0,ready:0,pub:0};
  wkTasks.forEach(t=>{ if(byStatus[t.status]!=null) byStatus[t.status]++; });
  const dnames=["一","二","三","四","五","六","日"];
  const tIdx=wk.indexOf(today());
  const dayCols=wk.map((d,i)=>{
    const dayTasks=tasks.filter(t=>t.date===d);
    const isToday=i===tIdx;
    return `<div class="sched-day-mini ${isToday?'today':''}">
      <div class="sdm-head">周${dnames[i]}</div>
      <div class="sdm-body">${dayTasks.length||''}</div>
    </div>`;
  }).join("");
  const statusList=[{k:"edit",l:"待编辑",c:"#d97706"},{k:"gen",l:"已生成",c:"#2563eb"},{k:"ready",l:"待发布",c:"#7c3aed"},{k:"pub",l:"已发布",c:"#16a34a"}]
    .map(s=>`<div class="sched-stat"><span class="ss-dot" style="background:${s.c}"></span><span class="ss-num">${byStatus[s.k]}</span><span class="ss-label">${s.l}</span></div>`).join("");
  return `<div class="tile b7"><div class="tile-h"><span class="tic">${icon("calendar",16)}</span><div class="tt"><span class="en">THIS WEEK</span><span class="zh">本周排期</span></div><span class="r js-open" data-open="schedule">${wkTasks.length} 条任务</span></div>
    <div class="sched-week-mini">${dayCols}</div>
    <div class="sched-status-row">${statusList}</div></div>`;
}

/* 转化目标进度（data.goals） */

/* 本周发布趋势（排期数据驱动） */
function publishTrendTileHTML(){
  const wk=weekDates();
  const tasks=data.schedule||[];
  const series=wk.map(d=>tasks.filter(t=>t.date===d).length);
  const has=series.some(v=>v>0);
  const total=series.reduce((a,b)=>a+b,0);
  const body=has?trendSVG(series):`<div class="trend-empty">${icon("chart",26)}<span>本周暂无排期任务</span></div>`;
  return `<div class="tile b8"><div class="tile-h"><span class="tic">${icon("chart",16)}</span><div class="tt"><span class="en">PUBLISH TREND · 近 7 天</span><span class="zh">本周发布趋势</span></div>${has?`<span class="r">共 ${total} 条</span>`:''}</div>
    ${body}${has?`<div class="trend-x"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>`:''}</div>`;
}

function renderHome(){
  /* ===== 展开模式：复用已有 renderModule + wireModule ===== */
  if(homeMode === "expand" && expandModuleKey && modOf(expandModuleKey)){
    renderModule(expandModuleKey);
    // 顶部插入「返回环形首页」按钮（insertAdjacentHTML 不破坏已有事件绑定）
    const backBar = `<div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;padding:10px 16px;background:var(--surface-card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);border-radius:var(--radius-control);box-shadow:var(--shadow-card);">
      <button id="ring-back" style="display:inline-flex;align-items:center;gap:6px;padding:8px 18px;background:var(--accent);color:var(--on-accent);border:none;border-radius:10px;cursor:pointer;font-family:var(--font);font-size:13px;font-weight:600;">
        ${icon("chevron",16,2.2)} 返回环形首页
      </button>
      <div style="flex:1"></div>
      <span style="font-size:12px;color:var(--text-tertiary)">${dateStr()}</span>
    </div>`;
    $("#screen").insertAdjacentHTML("afterbegin", backBar);
    const backSvg = $("#ring-back svg");
    if(backSvg) backSvg.style.transform = "rotate(180deg)";
    $("#ring-back").onclick = ()=>{
      homeMode = "ring";
      expandModuleKey = null;
      render();
    };
    return;
  }

  /* ===== 环形首页模式 ===== */
  if(homeMode !== "ring") homeMode = "ring";

  const now = new Date();
  const dow = (now.getDay()+6)%7;
  const q = CONFIG.quotes[dow % CONFIG.quotes.length];
  const hour = now.getHours();
  const hi = hour<5?"夜深了":hour<11?"早上好":hour<13?"中午好":hour<18?"下午好":"晚上好";

 /* 同一蓝色系；analytics 用红色描边/图标区分，其余统一 */
  const RING_BLUE = "#2563eb";
  const RING_DANGER = "#ef4444";
  const RING_FILL_OPACITY = 0.12;
  const DANGER_KEYS = new Set(["analytics"]);

  /* ringModules：在 CONFIG.modules 基础上增加 fillOpacity / isDanger */
  const ringModules = CONFIG.modules.map(m => {
    return { ...m, fillOpacity: RING_FILL_OPACITY, isDanger: DANGER_KEYS.has(m.key) };
  });

  const n = ringModules.length;
  const innerR = 135, outerR = 245, gap = 3;
  const sectorAngle = (360 - gap * n) / n;
  const labelR = (innerR + outerR) / 2;
  const cx = 280, cy = 280, svgSize = 560;

  const deg2rad = d => d * Math.PI / 180;
  const ptAt = (r, deg) => {
    const a = deg2rad(deg - 90);
    return [r * Math.cos(a), r * Math.sin(a)];
  };
  const sectorPath = (sDeg, eDeg) => {
    const [x1,y1] = ptAt(outerR, sDeg);
    const [x2,y2] = ptAt(outerR, eDeg);
    const [x3,y3] = ptAt(innerR, eDeg);
    const [x4,y4] = ptAt(innerR, sDeg);
    const la = (eDeg - sDeg) > 180 ? 1 : 0;
    return `M${(cx+x1).toFixed(1)} ${(cy+y1).toFixed(1)} A${outerR} ${outerR} 0 ${la} 1 ${(cx+x2).toFixed(1)} ${(cy+y2).toFixed(1)} L${(cx+x3).toFixed(1)} ${(cy+y3).toFixed(1)} A${innerR} ${innerR} 0 ${la} 0 ${(cx+x4).toFixed(1)} ${(cy+y4).toFixed(1)} Z`;
  };

  let sectorsHTML = "";
  let labelsHTML = "";
  ringModules.forEach((m, i) => {
    const sDeg = i * (sectorAngle + gap);
    const eDeg = sDeg + sectorAngle;
    const midDeg = sDeg + sectorAngle / 2;
    const strokeColor = m.isDanger ? RING_DANGER : RING_BLUE;
    const iconColor   = m.isDanger ? "var(--ring-danger-stroke)" : "var(--ring-stroke)";
    const popA = deg2rad(midDeg - 90);
    const popX = (Math.cos(popA) * 14).toFixed(1);
    const popY = (Math.sin(popA) * 14).toFixed(1);
    sectorsHTML += `<path class="ring-sector" d="${sectorPath(sDeg, eDeg)}" fill="${RING_BLUE}" fill-opacity="${m.fillOpacity}" stroke="${strokeColor}" stroke-opacity="0.6" stroke-width="2" data-ring-key="${m.key}" data-ring-fill="${m.fillOpacity}" data-pop-x="${popX}" data-pop-y="${popY}" style="--px:${popX}px;--py:${popY}px"/>`;
    const [lx, ly] = ptAt(labelR, midDeg);
    labelsHTML += `<div class="ring-label" data-ring-key="${m.key}" style="--px:${popX}px;--py:${popY}px;position:absolute;left:${(cx+lx).toFixed(1)}px;top:${(cy+ly).toFixed(1)}px;transform:translate(-50%,-50%) translate(0px,0px) scale(1);display:flex;flex-direction:column;align-items:center;gap:3px;pointer-events:none;">
      <span style="color:${iconColor};display:inline-flex;line-height:1;">${icon(m.icon, 24, 2)}</span>
      <span style="font-size:11.5px;font-weight:600;color:var(--text);text-align:center;line-height:1.2;white-space:nowrap;">${esc(m.name)}</span>
    </div>`;
    if(m.key === "settings") {
      const subInnerR = outerR + 12;
      const subOuterR = subInnerR + (outerR - innerR) * 0.5;
      const [sx1, sy1] = ptAt(subOuterR, sDeg);
      const [sx2, sy2] = ptAt(subOuterR, eDeg);
      const [sx3, sy3] = ptAt(subInnerR, eDeg);
      const [sx4, sy4] = ptAt(subInnerR, sDeg);
      const subLa = (eDeg - sDeg) > 180 ? 1 : 0;
      const subPath = `M${(cx+sx1).toFixed(1)} ${(cy+sy1).toFixed(1)} A${subOuterR} ${subOuterR} 0 ${subLa} 1 ${(cx+sx2).toFixed(1)} ${(cy+sy2).toFixed(1)} L${(cx+sx3).toFixed(1)} ${(cy+sy3).toFixed(1)} A${subInnerR} ${subInnerR} 0 ${subLa} 0 ${(cx+sx4).toFixed(1)} ${(cy+sy4).toFixed(1)} Z`;
      sectorsHTML += `<path class="ring-sub-panel" id="settings-sub-panel" d="${subPath}" fill="rgba(37,99,235,0.12)" stroke="${RING_BLUE}" stroke-opacity="0.45" stroke-width="2"/>`;
      const [bx, by] = ptAt((subInnerR + subOuterR) / 2, midDeg);
      const curTheme = document.documentElement.getAttribute("data-theme") || "light";
      labelsHTML += `<div class="ring-sub-buttons" id="settings-sub-buttons" data-rot="${midDeg.toFixed(1)}" style="position:absolute;left:${(cx+bx).toFixed(1)}px;top:${(cy+by).toFixed(1)}px;transform:translate(-50%,-50%) rotate(${midDeg.toFixed(1)}deg);display:flex;flex-direction:row;gap:10px;z-index:10;">
        <button class="theme-btn${curTheme==="light"?" active":""}" data-theme-val="light"></button>
        <button class="theme-btn${curTheme==="dark"?" active":""}" data-theme-val="dark"></button>
      </div>`;
    }
  });

  const centerCard = `<div style="position:absolute;left:${cx}px;top:${cy}px;transform:translate(-50%,-50%);width:220px;height:220px;border-radius:50%;background:var(--surface-card);backdrop-filter:blur(var(--blur));-webkit-backdrop-filter:blur(var(--blur));border:1px solid var(--border);box-shadow:var(--shadow-overlay);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;padding:20px;text-align:center;">
    <div style="font-size:14px;color:var(--text-secondary);">${hi}，${esc(CONFIG.owner)}</div>
    <div class="clk" id="clk" style="font-size:32px;font-weight:700;color:var(--accent);font-family:var(--font);letter-spacing:1px;">${pad2(now.getHours())}:${pad2(now.getMinutes())}:${pad2(now.getSeconds())}</div>
    <div style="font-size:11px;color:var(--text-tertiary);">${dateStr()}</div>
    <div style="font-size:10.5px;color:var(--text-tertiary);max-width:160px;line-height:1.3;margin-top:2px;">${esc(q)}</div>
    <div style="position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:9.5px;color:var(--text-tertiary);cursor:pointer;white-space:nowrap;text-decoration:underline;text-underline-offset:2px;text-decoration-color:var(--border);transition:color .2s;" onmouseover="this.style.color='var(--accent)'" onmouseout="this.style.color='var(--text-tertiary)'" onclick="go('settings')">更多设置</div>
  </div>`;

  $("#screen").innerHTML = `<style>
    .ring-sector{cursor:pointer;transform-box:fill-box;transform-origin:center;will-change:transform;transition:transform .26s cubic-bezier(.22,.61,.36,1),fill-opacity .2s ease-out,stroke-width .2s ease-out,filter .26s ease-out,opacity .25s ease-out}
    .ring-label{will-change:transform;transition:transform .26s cubic-bezier(.22,.61,.36,1),opacity .25s ease-out}
    .ring-sector.dimmed{opacity:.42}
    .ring-label.dimmed{opacity:.28}
    @keyframes ringClick{0%{transform:translate(var(--px),var(--py)) scale(1.1)}35%{transform:translate(var(--px),var(--py)) scale(0.96)}70%{transform:translate(var(--px),var(--py)) scale(1.13)}100%{transform:translate(var(--px),var(--py)) scale(1.1)}}
    @keyframes labelClick{0%{transform:translate(-50%,-50%) translate(var(--px),var(--py)) scale(1.1)}35%{transform:translate(-50%,-50%) translate(var(--px),var(--py)) scale(0.96)}70%{transform:translate(-50%,-50%) translate(var(--px),var(--py)) scale(1.13)}100%{transform:translate(-50%,-50%) translate(var(--px),var(--py)) scale(1.1)}}
    .ring-sector.is-clicked{animation:ringClick .3s ease-out}
    .ring-label.is-clicked{animation:labelClick .3s ease-out}
    .ring-sector{fill:var(--ring-fill);stroke:var(--ring-stroke)}
    .ring-sector[data-ring-key="analytics"]{fill:var(--ring-danger-fill);stroke:var(--ring-danger-stroke)}
    .ring-sector[data-ring-key="settings"]{cursor:default}
    .ring-label span:first-child{color:var(--ring-stroke)}
    .ring-label[data-ring-key="analytics"] span:first-child{color:var(--ring-danger-stroke)}
    .ring-sub-panel{opacity:0;transition:opacity .22s ease-out,transform .26s cubic-bezier(.22,.61,.36,1);pointer-events:none;cursor:default;stroke:var(--ring-stroke);stroke-opacity:0.45;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
    .ring-sub-panel.visible{opacity:1;pointer-events:auto}
    .ring-sub-buttons{opacity:0;transition:opacity .22s ease-out,transform .26s cubic-bezier(.22,.61,.36,1);pointer-events:none;transform-box:fill-box;transform-origin:center;will-change:transform,opacity}
    .ring-sub-buttons.visible{opacity:1;pointer-events:auto}
    .theme-btn{width:22px;height:22px;border-radius:50%;padding:0;cursor:pointer;transition:box-shadow .2s;outline:none;flex:0 0 auto;border:none}
    .theme-btn[data-theme-val="light"]{background:#fff;box-shadow:0 0 0 1px rgba(0,0,0,0.12)}
    .theme-btn[data-theme-val="dark"]{background:#000;box-shadow:0 0 0 1px rgba(255,255,255,0.12)}
    .theme-btn:hover{box-shadow:0 0 0 2px rgba(37,99,235,0.45)}
    .theme-btn.active{box-shadow:0 0 0 2px var(--accent),0 0 8px rgba(37,99,235,0.35)}
    @media(max-width:1049px){.ring-sub-panel,.ring-sub-buttons{display:none!important}}
  </style>
    <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:calc(100vh - 80px);padding:20px 0 40px;">
      <div style="position:relative;width:${svgSize}px;height:${svgSize}px;">
        <svg viewBox="0 0 ${svgSize} ${svgSize}" style="width:100%;height:100%;display:block;overflow:visible;">
          ${sectorsHTML}
        </svg>
        ${labelsHTML}
        ${centerCard}
      </div>
    </div>`;

  /* 交互动画：悬停弹出+其他 dimmed；点击 CSS 动画按压反馈后进入模块 */
  const sectors = $("#screen").querySelectorAll(".ring-sector");
  const labels  = $("#screen").querySelectorAll(".ring-label");
  const labelOf = key => [...labels].find(l => l.dataset.ringKey === key);
  const DEFAULT_T  = "translate(0px,0px) scale(1)";
  const DEFAULT_TL = "translate(-50%,-50%) translate(0px,0px) scale(1)";
  const settingsSector = [...sectors].find(s => s.dataset.ringKey === "settings");
  const subPanel = $("#settings-sub-panel");
  const subButtons = $("#settings-sub-buttons");
  const sLabel = labelOf("settings");
  let subOpen = false;
  let settingsCloseTimer = null;
  const canShow = () => window.innerWidth >= 1050 && homeMode === "ring";

  sectors.forEach(el => {
    const key = el.dataset.ringKey;
    const orig = el.dataset.ringFill;
    const popX = el.dataset.popX + "px", popY = el.dataset.popY + "px";
    const label = labelOf(key);
    const popT   = `translate(${popX}, ${popY}) scale(1.1)`;
    const popTL  = `translate(-50%,-50%) translate(${popX}, ${popY}) scale(1.1)`;
    let clicking = false;

    el.addEventListener("mouseenter", () => {
      if(clicking) return;
      el.style.transform = popT;
      el.setAttribute("fill-opacity","0.42");
      el.setAttribute("stroke-width","2.5");
      el.style.filter = "drop-shadow(0 4px 10px rgba(37,99,235,0.15))";
      if(label) label.style.transform = popTL;
      if(key === "settings") {
        clearTimeout(settingsCloseTimer);
        if(subPanel) subPanel.style.transform = popT;
        if(subButtons) subButtons.style.transform = `translate(-50%,-50%) translate(${popX}, ${popY}) rotate(${subButtons.dataset.rot}deg) scale(1.1)`;
      }
      sectors.forEach(s => { if(s!==el) s.classList.add("dimmed"); });
      labels.forEach(l  => { if(l!==label) l.classList.add("dimmed"); });
    });

    el.addEventListener("mouseleave", () => {
      if(clicking) return;
      if(key === "settings" && subButtons && subButtons.classList.contains("visible")) {
        clearTimeout(settingsCloseTimer);
        settingsCloseTimer = setTimeout(() => {
          subOpen = false;
          subPanel.classList.remove("visible");
          subButtons.classList.remove("visible");
          el.style.transform = DEFAULT_T;
          el.setAttribute("fill-opacity", orig);
          el.setAttribute("stroke-width","2");
          el.style.filter = "";
          if(label) label.style.transform = DEFAULT_TL;
          subPanel.style.transform = "";
          subButtons.style.transform = `translate(-50%,-50%) rotate(${subButtons.dataset.rot}deg)`;
          sectors.forEach(s => s.classList.remove("dimmed"));
          labels.forEach(l  => l.classList.remove("dimmed"));
        }, 220);
        return;
      }
      el.style.transform = DEFAULT_T;
      el.setAttribute("fill-opacity", orig);
      el.setAttribute("stroke-width","2");
      el.style.filter = "";
      if(label) label.style.transform = DEFAULT_TL;
      if(key === "settings") {
        subPanel.style.transform = "";
        subButtons.style.transform = `translate(-50%,-50%) rotate(${subButtons.dataset.rot}deg)`;
      }
      sectors.forEach(s => s.classList.remove("dimmed"));
      labels.forEach(l  => l.classList.remove("dimmed"));
    });

    el.onclick = () => {
      if(clicking) return;
      clicking = true;
      if(key !== "settings" && subOpen) {
        clearTimeout(settingsCloseTimer);
        subOpen = false;
        subPanel.classList.remove("visible");
        subButtons.classList.remove("visible");
      }
      el.classList.add("is-clicked");
      if(label) label.classList.add("is-clicked");
      setTimeout(() => {
        el.classList.remove("is-clicked");
        if(label) label.classList.remove("is-clicked");
        clicking = false;
        expandModuleKey = key;
        homeMode = "expand";
        render();
      }, 300);
    };
  });

  /* 设置扇区：点击展开副面板 + 合并热区交互 */
  if(settingsSector && subPanel && subButtons) {
    const ssPopX = settingsSector.dataset.popX + "px";
    const ssPopY = settingsSector.dataset.popY + "px";
    const ssPopT = `translate(${ssPopX}, ${ssPopY}) scale(1.1)`;
    const ssPopTL = `translate(-50%,-50%) translate(${ssPopX}, ${ssPopY}) scale(1.1)`;
    const ssOrig = settingsSector.dataset.ringFill;
    const resetSettingsHover = () => {
      settingsSector.style.transform = DEFAULT_T;
      settingsSector.setAttribute("fill-opacity", ssOrig);
      settingsSector.setAttribute("stroke-width", "2");
      settingsSector.style.filter = "";
      if(sLabel) sLabel.style.transform = DEFAULT_TL;
      subPanel.style.transform = "";
      subButtons.style.transform = `translate(-50%,-50%) rotate(${subButtons.dataset.rot}deg)`;
      sectors.forEach(s => s.classList.remove("dimmed"));
      labels.forEach(l => l.classList.remove("dimmed"));
    };
    const closeSubPanel = () => {
      clearTimeout(settingsCloseTimer);
      subOpen = false;
      subPanel.classList.remove("visible");
      subButtons.classList.remove("visible");
      resetSettingsHover();
    };
    if(window._closeSubPanel) {
      document.removeEventListener("click", window._closeSubPanel);
      window._closeSubPanel = null;
    }
    settingsSector.onclick = (e) => {
      e.stopPropagation();
      if(!canShow()) return;
      clearTimeout(settingsCloseTimer);
      settingsSector.classList.add("is-clicked");
      if(sLabel) sLabel.classList.add("is-clicked");
      setTimeout(() => {
        settingsSector.classList.remove("is-clicked");
        if(sLabel) sLabel.classList.remove("is-clicked");
      }, 300);
      subOpen = !subOpen;
      subPanel.classList.toggle("visible", subOpen);
      subButtons.classList.toggle("visible", subOpen);
      if(!subOpen) resetSettingsHover();
    };
    const onSubEnter = () => {
      if(!subOpen || !canShow()) return;
      clearTimeout(settingsCloseTimer);
      subPanel.style.transform = ssPopT;
      subButtons.style.transform = `translate(-50%,-50%) translate(${ssPopX}, ${ssPopY}) rotate(${subButtons.dataset.rot}deg) scale(1.1)`;
      settingsSector.style.transform = ssPopT;
      settingsSector.setAttribute("fill-opacity","0.42");
      settingsSector.setAttribute("stroke-width","2.5");
      settingsSector.style.filter = "drop-shadow(0 4px 10px rgba(37,99,235,0.15))";
      if(sLabel) sLabel.style.transform = ssPopTL;
    };
    const onSubLeave = () => {
      if(!subOpen) return;
      clearTimeout(settingsCloseTimer);
      settingsCloseTimer = setTimeout(closeSubPanel, 220);
    };
    subPanel.addEventListener("mouseenter", onSubEnter);
    subPanel.addEventListener("mouseleave", onSubLeave);
    subButtons.addEventListener("mouseenter", onSubEnter);
    subButtons.addEventListener("mouseleave", onSubLeave);
    subButtons.querySelectorAll(".theme-btn").forEach(btn => {
      btn.onclick = (e) => {
        e.stopPropagation();
        const val = btn.dataset.themeVal;
        setTheme(val);
        subButtons.querySelectorAll(".theme-btn").forEach(b => b.classList.toggle("active", b === btn));
      };
    });
  }

  startClock();
}

function wireHome(){
  $("#screen").querySelectorAll("[data-open]").forEach(el=>el.onclick=()=>go(el.dataset.open));
  $("#screen").querySelectorAll("[data-quick]").forEach(el=>el.onclick=()=>{ go(el.dataset.quick); openEditor(el.dataset.quick,null); });
  const find=el=>(data[el.dataset.mkey]||[]).find(i=>i.id==el.dataset.id);
  // 置顶区就地操作（仅对 CONFIG.modules 中定义的模块生效）
  $("#screen").querySelectorAll(".js-pin-chk").forEach(el=>el.onclick=e=>{
    e.stopPropagation(); const m=modOf(el.dataset.mkey); if(!m) return; const x=find(el); if(!x) return;
    if(m.type==="todo"){ x.done=!x.done; }
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist();
  });
  $("#screen").querySelectorAll(".js-pin-inc").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=(+x.current||0)+1; persist(); });
  $("#screen").querySelectorAll(".js-pin-dec").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=find(el); if(!x) return; x.current=Math.max(0,(+x.current||0)-1); persist(); });
  $("#screen").querySelectorAll(".js-pin-open").forEach(el=>el.onclick=e=>{ e.stopPropagation(); openEditor(el.dataset.mkey, find(el)); });
}

/* ---------- MODULE VIEW ---------- */
function renderModule(key){
  const m=modOf(key); const all=data[key]||[];
  const t=today();
  const q=searchQ.trim().toLowerCase();
  let filtered=applyFilters(all,q,m);
  const it=sortRecords(filtered);
  const sel=getBatchSet(key);
  const selCount=sel.size;

  let head="";
  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    head=`<div class="mod-summary">
      <div class="mini"><div class="l">收入</div><div class="v" style="color:var(--module-1)">¥${inc}</div></div>
      <div class="mini"><div class="l">支出</div><div class="v" style="color:var(--danger)">¥${exp}</div></div>
      <div class="mini"><div class="l">结余</div><div class="v">¥${inc-exp}</div></div>
      <div class="mini"><div class="l">笔数</div><div class="v">${all.length}</div></div></div>`;
  } else if(m.type==="todo"){
    const done=all.filter(x=>x.done).length;
    head=headHero(m, `${done}/${all.length}`, "今日已完成");
  } else if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length;
    head=headHero(m, `${done}/${all.length}`, "今日已打卡");
  } else if(m.type==="progress"){
    const p=avgProgress(all);
    head=headHero(m, `${p.value}%`, `平均进度 · ${all.length} 项`);
  } else if(m.type==="note"){
    const todayN=all.filter(x=>x.date===t).length;
    head=headHero(m, `${all.length}`, `条记录 · 今日 ${todayN} 条`, null);
  }

  const body = it.length ? it.map(x=>recHTML(m,x,sel.has(x.id))).join("")
    : `<div class="empty"><div style="color:var(--text-tertiary);margin-bottom:8px">${icon(m.icon,32,1.5)}</div><div>${q?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;

  const sortOpts=[{v:"date-desc",l:"日期↓"},{v:"date-asc",l:"日期↑"},{v:"pinned-first",l:"置顶优先"}]
    .map(o=>`<div class="opt ${o.v===sortMode?'on':''}" data-sort="${o.v}">${o.l}</div>`).join("");

  const batchBar = selCount>0 ? `<div class="batch-bar">
    <label class="batch-sel-all"><div class="chk-box on">${icon("check",13,2.4)}</div><span>已选 ${selCount} 项</span></label>
    <div class="spacer"></div>
    <button class="btn ghost" id="btn-export">${icon("download",14,2.2)}导出选中</button>
    <button class="btn danger" id="btn-batch-del">${icon("trash",14,2.2)}批量删除</button>
    <button class="btn ghost" id="btn-cancel-sel">取消选择</button>
  </div>` : `<div class="batch-bar" style="display:flex;align-items:center;gap:8px">
    <label class="batch-sel-all" id="lbl-sel-all"><div class="chk-box"></div><span>全选</span></label>
    <div class="spacer"></div>
    <div class="sort-wrap"><span class="sort-label">${icon("sort",14,2.2)}排序</span><div class="seg sort-seg">${sortOpts}</div></div>
  </div>`;

  // 筛选控件
  const filterHTML=buildFilterBar(m);

  $("#screen").innerHTML=`<div class="header"><div><h2>${m.name}</h2><p>${m.desc}</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    <div class="toolbar">
      <div class="search-box">${icon("search",15,2.2)}<input id="search" placeholder="搜索…" value="${attr(searchQ)}"/></div>
      <div class="spacer"></div><button class="btn" id="btn-new">${icon("plus",16,2.2)}新建</button></div>
    ${filterHTML}
    ${head}
    ${batchBar}
    <div class="mod-layout">
      <div class="mod-main">
        <div class="sec-title">全部记录 <span id="rec-count" style="margin-left:auto;font-weight:500;color:var(--text-secondary);font-size:12px">${it.length} 条</span></div>
        <div class="rec-grid">${body}</div>
      </div>
      <aside class="mod-side">${sideStats(m,all)}</aside>
    </div>`;
  const s=$("#search");
  let composing=false;
  const refresh=()=>{ searchQ=s.value; renderModuleResults(key); };
  s.addEventListener("compositionstart",()=>{ composing=true; });
  s.addEventListener("compositionend",()=>{ composing=false; refresh(); });
  s.addEventListener("input",()=>{ if(!composing) refresh(); });
  s.addEventListener("keydown",e=>{
    if(e.key==="Enter"){
      if(e.isComposing) return;
      e.preventDefault();
      composing=false;
      refresh();
    }
  });
  const searchIcon = s.parentElement.querySelector("svg");
  if(searchIcon) searchIcon.onclick = () => { s.focus(); refresh(); };
  wireFilters(key);
  wireSideStats(key);
  $("#btn-new").onclick=()=>openEditor(key,null);
  wireBatchActions(key);
  wireModule(key);
}

/* 构建筛选栏：日期范围 + 分类/mood/状态 */
function buildFilterBar(m){
  let catHTML="";
  if(m.type==="finance" && m.categories){
    catHTML=`<select class="filter-sel" id="filter-cat"><option value="">全部分类</option>${m.categories.map(c=>`<option value="${esc(c)}" ${filterCat===c?'selected':''}>${esc(c)}</option>`).join("")}</select>`;
  } else if(m.type==="note" && m.moods){
    catHTML=`<select class="filter-sel" id="filter-cat"><option value="">全部分类</option>${m.moods.map(c=>`<option value="${esc(c)}" ${filterCat===c?'selected':''}>${esc(c)}</option>`).join("")}</select>`;
  } else if(m.type==="todo" && m.priorities){
    catHTML=`<select class="filter-sel" id="filter-cat"><option value="">全部状态</option>${m.priorities.map(c=>`<option value="${esc(c.key)}" ${filterCat===c.key?'selected':''}>${esc(c.label)}</option>`).join("")}</select>`;
  }
  return `<div class="filter-bar">
    <div class="filter-date"><span class="filter-label">日期</span>
      <input type="date" id="filter-from" value="${filterFrom||''}" placeholder="开始"/>
      <span class="filter-sep">~</span>
      <input type="date" id="filter-to" value="${filterTo||''}" placeholder="结束"/>
    </div>
    ${catHTML?`<div class="filter-cat">${catHTML}</div>`:''}
    ${(filterFrom||filterTo||filterCat)?`<button class="filter-clear" id="filter-clear">${icon("close",12,2.2)}清除筛选</button>`:''}
  </div>`;
}

/* 统一筛选函数：搜索 + 日期 + 分类 */
function applyFilters(all,q,m){
  let r=q?all.filter(x=>(x.title||"").toLowerCase().includes(q)||(x.note||x.content||"").toLowerCase().includes(q)):all.slice();
  if(filterFrom) r=r.filter(x=>(x.date||"")>=filterFrom);
  if(filterTo) r=r.filter(x=>(x.date||"")<=filterTo);
  if(filterCat){
    if(m.type==="finance") r=r.filter(x=>(x.category||"")===filterCat);
    else if(m.type==="note") r=r.filter(x=>(x.mood||"")===filterCat);
    else if(m.type==="todo") r=r.filter(x=>(x.priority||"")===filterCat);
  }
  return r;
}

/* 绑定筛选控件事件 */
function wireFilters(key){
  const m=modOf(key);
  const fromEl=$("#filter-from"), toEl=$("#filter-to"), catEl=$("#filter-cat"), clearEl=$("#filter-clear");
  if(fromEl) fromEl.onchange=()=>{ filterFrom=fromEl.value; renderModuleResults(key); };
  if(toEl) toEl.onchange=()=>{ filterTo=toEl.value; renderModuleResults(key); };
  if(catEl) catEl.onchange=()=>{ filterCat=catEl.value; renderModuleResults(key); };
  if(clearEl) clearEl.onclick=()=>{ filterFrom=""; filterTo=""; filterCat=""; renderModule(key); };
}

/* 绑定侧边统计栏点击筛选 */
function wireSideStats(key){
  const m=modOf(key);
  $("#screen").querySelectorAll(".js-stat-filter").forEach(el=>{
    el.onclick=()=>{
      const val=el.dataset.filter;
      if(filterCat===val){ filterCat=""; } else { filterCat=val; }
      // 同步更新下拉框选中状态
      const sel=$("#filter-cat"); if(sel) sel.value=filterCat;
      renderModuleResults(key);
    };
  });
  $("#screen").querySelectorAll(".js-stat-today").forEach(el=>{
    el.onclick=()=>{
      const t=today();
      if(filterFrom===t&&filterTo===t){ filterFrom=""; filterTo=""; } else { filterFrom=t; filterTo=t; }
      const f=$("#filter-from"),to=$("#filter-to"); if(f) f.value=filterFrom; if(to) to.value=filterTo;
      renderModuleResults(key);
    };
  });
}

/* 仅刷新受搜索影响的记录列表与计数，不重建搜索框（避免打断中文输入法） */
function renderModuleResults(key){
  const m=modOf(key); const all=data[key]||[];
  const q=searchQ.trim().toLowerCase();
  let filtered=applyFilters(all,q,m);
  const it=sortRecords(filtered);
  const sel=getBatchSet(key);
  const body = it.length ? it.map(x=>recHTML(m,x,sel.has(x.id))).join("")
    : `<div class="empty"><div style="color:var(--text-tertiary);margin-bottom:8px">${icon(m.icon,32,1.5)}</div><div>${(q||filterFrom||filterTo||filterCat)?'没有匹配的记录':'还没有记录，点右上角「新建」添加第一条吧'}</div></div>`;
  const grid=$(".rec-grid"); if(grid) grid.innerHTML=body;
  const cnt=$("#rec-count"); if(cnt) cnt.textContent=`${it.length} 条`;
  wireModule(key);
}

/* 模块统计侧栏：按 type 生成多维数据，填满右侧空间 */
function sideStats(m, all){
  const t=today();
  const palette=["var(--accent)","var(--module-1)","var(--module-2)","var(--module-3)","var(--module-4)","var(--module-5)","var(--danger)"];
  const row=(k,v,dot,filterVal)=>`<div class="stat-row ${filterVal?'js-stat-filter':''}" ${filterVal?`data-filter="${esc(filterVal)}"`:''}><span class="k">${dot?`<span class="kd" style="background:${dot}"></span>`:''}${k}</span><span class="val">${v}</span></div>`;
  const todayRow=(k,v)=>`<div class="stat-row js-stat-today"><span class="k">${k}</span><span class="val">${v}</span></div>`;

  if(m.type==="finance"){
    const inc=all.filter(x=>x.type==="income").reduce((a,x)=>a+ +x.amount,0);
    const exp=all.filter(x=>x.type==="expense").reduce((a,x)=>a+ +x.amount,0);
    // 支出按分类聚合
    const byCat={}; all.filter(x=>x.type==="expense").forEach(x=>{ const c=x.category||"其他"; byCat[c]=(byCat[c]||0)+ +x.amount; });
    const cats=Object.entries(byCat).sort((a,b)=>b[1]-a[1]);
    const maxC=cats.length?cats[0][1]:1;
    const catBars=cats.length? cats.map((c,i)=>`<div class="cbrow js-stat-filter" data-filter="${esc(c[0])}"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxC*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">¥${c[1]}</span></div>`).join("")
      : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无支出记录</div>`;
    const todayExp=all.filter(x=>x.type==="expense"&&x.date===t).reduce((a,x)=>a+ +x.amount,0);
    return `<div class="side-card"><div class="sh">${icon("wallet",15)} 收支概况</div>
        ${row("总收入",`<span style="color:var(--module-1)">¥${inc}</span>`)}
        ${row("总支出",`<span style="color:var(--danger)">¥${exp}</span>`)}
        ${row("净结余",`¥${inc-exp}`)}
        ${todayRow("今日支出",`¥${todayExp}`)}
        ${row("总笔数",`${all.length} 笔`)}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 支出分类占比 · 点击筛选</div><div class="catbar">${catBars}</div></div>`;
  }

  if(m.type==="progress"){
    const p=avgProgress(all);
    const doneN=all.filter(x=>((x.current/x.target)*100||0)>=100).length;
    const totalCur=all.reduce((a,x)=>a+ (+x.current||0),0);
    const totalTgt=all.reduce((a,x)=>a+ (+x.target||0),0);
    return `<div class="side-card"><div class="sh">${icon("target",15)} 总体进度</div>
        <div class="side-ring"><div class="dial">${ringSVG(p.value,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${p.value}%</span><span class="cap">平均进度</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("list",15)} 数据统计</div>
        ${row("进行项目",`${all.length} 项`)}
        ${row("已达成",`${doneN} 项`)}
        ${row("累计完成",`${totalCur} ${all[0]?.unit||m.unit||''}`)}
        ${row("总目标量",`${totalTgt} ${all[0]?.unit||m.unit||''}`)}</div>`;
  }

  if(m.type==="checkin"){
    const done=all.filter(x=>x.log&&x.log[t]).length; const pct=all.length?Math.round(done/all.length*100):0;
    const streaks=all.map(x=>({title:x.title,s:streak(x.log)})).sort((a,b)=>b.s-a.s);
    const best=streaks[0]?streaks[0].s:0;
    const list=streaks.slice(0,6).map(x=>`<div class="stat-row"><span class="k">${esc(x.title)}</span><span class="val" style="color:var(--module-3)">${x.s} 天</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("leaf",15)} 今日打卡</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${done}/${all.length}</span><span class="cap">已完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("flame",15)} 连续天数</div>
        ${row("最长连续",`<span style="color:var(--module-3)">${best} 天</span>`)}
        ${row("习惯总数",`${all.length} 个`)}
        <div style="margin-top:6px">${list}</div></div>`;
  }

  if(m.type==="todo"){
    const done=all.filter(x=>x.done).length; const pct=all.length?Math.round(done/all.length*100):0;
    const byP={}; (m.priorities||[]).forEach(p=>byP[p.key]=0); all.forEach(x=>{ if(byP[x.priority]!=null) byP[x.priority]++; });
    const pRows=(m.priorities||[]).map(p=>`<div class="stat-row js-stat-filter" data-filter="${esc(p.key)}"><span class="k"><span class="kd" style="background:${p.text}"></span>${p.label}</span><span class="val">${byP[p.key]||0} 项</span></div>`).join("");
    return `<div class="side-card"><div class="sh">${icon("list",15)} 完成情况</div>
        <div class="side-ring"><div class="dial">${ringSVG(pct,m.color)}<span class="mid"><span class="big" style="color:${m.color}">${pct}%</span><span class="cap">${done}/${all.length} 完成</span></span></div></div></div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 优先级分布 · 点击筛选</div>
        ${pRows}
        ${row("剩余待办",`${all.length-done} 项`)}</div>`;
  }

  // note
  // 选题池专用侧栏：漏斗统计
  if(m.key==="topic"){
    const total=all.length;
    const mustFilm=all.filter(x=>x.mood==="当周必拍").length;
    const backup=all.filter(x=>x.mood==="备选").length;
    const reserve=all.filter(x=>x.mood==="长期储备").length;
    const hasScript=all.filter(x=>x.scriptId).length;
    const byStatus={}; all.forEach(x=>{ const s=x.topicStatus||"待写脚本"; byStatus[s]=(byStatus[s]||0)+1; });
    const statusRows=Object.entries(byStatus).sort((a,b)=>b[1]-a[1]).map(([k,v])=>{
      const pct=total?Math.round(v/total*100):0;
      const colors={"待写脚本":"#3b82f6","待拍摄":"#a855f7","已拍摄":"#f59e0b","已发布":"#10b981","复盘中":"#6b7280"};
      const c=colors[k]||"#6b7280";
      return `<div class="funnel-row"><span class="fr-label">${esc(k)}</span><span class="fr-bar"><i style="width:${pct}%;background:${c}"></i></span><span class="fr-val">${v}</span></div>`;
    }).join("");
    const scriptRate=total?Math.round(hasScript/total*100):0;
    return `<div class="side-card"><div class="sh">${icon("bulb",15)} 选题漏斗 · 点击筛选</div>
        ${row("选题总数",`${total} 条`)}
        ${row("当周必拍",`<span style="color:#dc2626">${mustFilm} 条</span>`,"#dc2626","当周必拍")}
        ${row("备选",`<span style="color:#f59e0b">${backup} 条</span>`,"#f59e0b","备选")}
        ${row("长期储备",`<span style="color:#6b7280">${reserve} 条</span>`,"#6b7280","长期储备")}</div>
      <div class="side-card"><div class="sh">${icon("chart",15)} 脚本转化</div>
        ${row("已生成脚本",`<span style="color:#10b981">${hasScript} 条</span>`)}
        ${row("转化率",`${scriptRate}%`)}
        ${row("待写脚本",`${total-hasScript} 条`)}
        <div style="margin-top:8px;padding-top:8px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--text-tertiary);margin-bottom:6px">按状态分布</div>
        <div class="topic-funnel">${statusRows||'<div style="color:var(--text-tertiary);font-size:12.5px">暂无数据</div>'}</div></div></div>`;
  }

  const todayN=all.filter(x=>x.date===t).length;
  const byMood={}; all.forEach(x=>{ const md=x.mood||"未分类"; byMood[md]=(byMood[md]||0)+1; });
  const moods=Object.entries(byMood).sort((a,b)=>b[1]-a[1]);
  const maxM=moods.length?moods[0][1]:1;
  const moodBars=moods.length? moods.map((c,i)=>`<div class="cbrow js-stat-filter" data-filter="${esc(c[0])}"><span class="cbn">${esc(c[0])}</span><span class="cbt"><i style="width:${Math.round(c[1]/maxM*100)}%;background:${palette[i%palette.length]}"></i></span><span class="cbv">${c[1]} 条</span></div>`).join("")
    : `<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无记录</div>`;
  return `<div class="side-card"><div class="sh">${icon("pen",15)} 记录统计</div>
      ${row("累计记录",`${all.length} 条`)}
      ${todayRow("今日新增",`${todayN} 条`)}
      ${row("标签种类",`${moods.length} 种`)}</div>
    <div class="side-card"><div class="sh">${icon("chart",15)} 标签分布 · 点击筛选</div><div class="catbar">${moodBars}</div></div>`;
}
