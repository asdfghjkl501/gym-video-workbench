function recHTML(m,x,selected){
  const pin=`<button class="pin-btn js-pin ${x.pinned?'on':''}" data-id="${x.id}" title="置顶">${icon("star",15)}</button>`;
  const del=`<button class="del js-del" data-id="${x.id}" title="删除">${icon("trash",15)}</button>`;
  const batchChk=`<div class="batch-chk ${selected?'on':''}" data-batch-id="${x.id}">${selected?icon("check",13,2.4):''}</div>`;
  const acts=`<div class="acts">${batchChk}${pin}${del}</div>`;
  const chkMark=icon("check",13,2.4);
  const thumb=x.image?`<img class="thumb" src="${attr(x.image)}" alt="">`:'';

  // 选题池特殊标签渲染
  let customMeta="";
  if(m.key==="topic"){
    const tags=[];
    if(x.source) tags.push(`<span class="meta-tag tag-source">${esc(x.source)}</span>`);
    if(x.angle) tags.push(`<span class="meta-tag tag-angle">${esc(x.angle)}</span>`);
    if(x.riskLevel){ const rc=x.riskLevel==='低'?'tag-risk-low':x.riskLevel==='中'?'tag-risk-mid':'tag-risk-high'; tags.push(`<span class="meta-tag ${rc}">风险:${esc(x.riskLevel)}</span>`); }
    if(x.topicStatus) tags.push(`<span class="meta-tag tag-status">${esc(x.topicStatus)}</span>`);
    if(x.scriptId) tags.push(`<span class="meta-tag tag-linked">✓ 已生成脚本</span>`);
    customMeta=tags.join("");
  } else {
    customMeta=(m.fields||[]).filter(f=>x[f.key] && f.type!=="textarea" && f.type!=="note").map(f=>{
      const val=String(x[f.key]).length>20?String(x[f.key]).slice(0,20)+'…':x[f.key];
      return `<span class="meta-tag" title="${attr(x[f.key])}">${esc(val)}</span>`;
    }).join("");
  }
  const customBlock=customMeta?`<div class="meta-line">${customMeta}</div>`:'';

  // 跨模块操作按钮
  let moduleActions="";
  if(m.key==="hotlib"){
    // 爆款库：检查是否已转为选题
    const linked=(data.topic||[]).find(t=>t.hotlibId==String(x.id));
    if(linked){
      moduleActions=`<div class="rec-action linked" title="已转为选题">${icon("check",12,2.2)}已转选题</div>`;
    } else {
      moduleActions=`<div class="rec-action to-topic" data-to-topic="${x.id}">${icon("arrow",12,2.2)}转为选题</div>`;
    }
  } else if(m.key==="topic"){
    // 选题池：检查是否已生成脚本
    if(x.scriptId){
      moduleActions=`<div class="rec-action to-script" data-view-script="${x.scriptId}">${icon("pen",12,2.2)}查看脚本</div>`;
    } else {
      moduleActions=`<div class="rec-action to-script" data-to-script="${x.id}">${icon("arrow",12,2.2)}生成脚本</div>`;
    }
  }

  const layout=x.layout||'default';
  const layoutCls=`rec-layout-${layout}`;

  // feature layout: 大图在上 + 标题 + 正文在下 (适合有图记录)
  if(layout==='feature' && x.image){
    const body=(x.content||x.note||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}">
      ${thumb}
      <div class="feat-title">${esc(x.title||'无标题')}</div>
      ${body?`<div class="feat-body">${esc(body)}</div>`:''}
      ${customBlock?`<div style="padding:0 16px 14px">${customBlock}</div>`:''}
      ${moduleActions?`<div style="padding:0 16px 14px">${moduleActions}</div>`:''}</div></div>`;
  }
  // quote layout: 大字居中 (适合短文本/灵感/金句)
  if(layout==='quote'){
    const text=(x.content||x.title||'').trim();
    return `<div class="rec ${layoutCls}">${acts}<div class="top" data-edit="${x.id}" style="flex-direction:column;align-items:center;text-align:center">
      <div class="quote-text">${esc(text)}</div>
      ${x.mood?`<div class="quote-meta">${esc(x.mood)}${x.date?` · ${esc(x.date)}`:''}</div>`:(x.date?`<div class="quote-meta">${esc(x.date)}</div>`:'')}
      ${customBlock?`<div style="margin-top:8px">${customBlock}</div>`:''}
      ${moduleActions?`<div style="margin-top:8px">${moduleActions}</div>`:''}</div></div>`;
  }

  // default layout
  if(m.type==="todo"){ const p=(m.priorities||[]).find(p=>p.key===x.priority);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${x.done?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname ${x.done?'done':''}">${esc(x.title)}</span>
      ${p?`<span class="badge" style="background:${p.color};color:${p.text}"><span class="dot"></span>${p.label}</span>`:''}
      ${x.note?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.note).slice(0,40)}</span>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="checkin"){ const on=!!(x.log&&x.log[today()]); const st=streak(x.log);
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px"><div class="chk js-chk ${on?'on':''}" data-id="${x.id}">${chkMark}</div>
      ${thumb}
      <div class="body" data-edit="${x.id}"><span class="rname">${esc(x.title)}</span>
      <span class="streak">${icon("flame",13)} 连续 ${st} 天</span>${on?'<span class="badge" style="background:var(--accent-muted);color:var(--accent)">今日已打卡</span>':''}${customBlock}</div></div></div>`; }
  if(m.type==="progress"){ const pct=Math.min(100,Math.round((x.current/x.target)*100||0));
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <div class="pbar"><i style="width:${pct}%;background:${m.color}"></i></div>
      <span class="rdate" style="margin-left:0;color:var(--text-secondary)">${x.current}/${x.target} ${x.unit||m.unit||''} · ${pct}%</span>
      ${x.note?`<div class="rnote">${esc(x.note)}</div>`:''}${customBlock}</div></div></div>`; }
  if(m.type==="finance"){ const inc=x.type==="income";
    return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
      <span class="rname">${esc(x.title)}</span>
      <span class="badge" style="background:var(--surface-nested);color:var(--text-secondary)">${esc(x.category||'其他')}</span>
      <span class="rdate">${x.date||''}</span>${customBlock}</div>
      <div class="amt ${inc?'inc':'exp'}">${inc?'+':'-'}¥${x.amount}</div></div></div>`; }
  // note
  return `<div class="rec ${layoutCls}">${acts}<div class="top" style="padding-right:60px">${thumb}<div class="body" data-edit="${x.id}">
    <span class="rname">${esc(x.title||'无标题')}</span>
    ${x.mood?`<span class="badge" style="background:var(--accent-muted);color:var(--accent)">${esc(x.mood)}</span>`:''}
    ${x.content?`<span class="rdate" style="margin-left:0;color:var(--text-tertiary)">${esc(x.content).slice(0,40)}</span>`:''}
    <span class="rdate">${x.date||''}</span>${customBlock}
    ${moduleActions?`<div style="margin-top:6px">${moduleActions}</div>`:''}</div></div></div>`;
}

function streak(log){ if(!log) return 0; let n=0; const d=new Date();
  for(;;){ const k=d.toISOString().slice(0,10); if(log[k]){ n++; d.setDate(d.getDate()-1);} else break; } return n; }

function wireModule(key){ const m=modOf(key);
  $("#screen").querySelectorAll(".js-chk").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const x=(data[key]).find(i=>i.id==el.dataset.id);
    if(m.type==="todo") x.done=!x.done;
    else if(m.type==="checkin"){ x.log=x.log||{}; const t=today(); x.log[t]?delete x.log[t]:x.log[t]=true; }
    persist(); });
  $("#screen").querySelectorAll("[data-edit]").forEach(el=>el.onclick=()=>{
    if(el.closest("[data-batch-id]")) return;
    openEditor(key,(data[key]).find(i=>i.id==el.dataset.edit));
  });
  $("#screen").querySelectorAll(".js-del").forEach(el=>el.onclick=e=>{ e.stopPropagation(); confirmDelete(key, el.dataset.id); });
  $("#screen").querySelectorAll(".js-pin").forEach(el=>el.onclick=e=>{ e.stopPropagation(); const x=(data[key]).find(i=>i.id==el.dataset.id); x.pinned=!x.pinned; persist(); });
  // 批量选中复选框
  $("#screen").querySelectorAll("[data-batch-id]").forEach(el=>el.onclick=e=>{ e.stopPropagation();
    const id=+el.dataset.batchId; const sel=getBatchSet(key);
    if(sel.has(id)) sel.delete(id); else sel.add(id);
    renderModule(key);
  });
  // 跨模块操作：爆款→选题
  $("#screen").querySelectorAll("[data-to-topic]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); convertToTopic(+el.dataset.toTopic); });
  // 跨模块操作：选题→脚本
  $("#screen").querySelectorAll("[data-to-script]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); generateScriptFromTopic(+el.dataset.toScript); });
  // 跨模块操作：查看已关联脚本
  $("#screen").querySelectorAll("[data-view-script]").forEach(el=>el.onclick=e=>{ e.stopPropagation(); viewScript(+el.dataset.viewScript); });
}

/* 批量操作工具栏事件绑定 */
function wireBatchActions(key){
  const selAll=$("#lbl-sel-all");
  if(selAll) selAll.onclick=()=>{
    const all=data[key]||[]; const sel=getBatchSet(key);
    if(sel.size===all.length){ sel.clear(); } else { all.forEach(x=>sel.add(x.id)); }
    renderModule(key);
  };
  const cancelSel=$("#btn-cancel-sel");
  if(cancelSel) cancelSel.onclick=()=>{ getBatchSet(key).clear(); renderModule(key); };
  const batchDel=$("#btn-batch-del");
  if(batchDel) batchDel.onclick=()=>{
    const sel=getBatchSet(key); const ids=[...sel];
    if(!ids.length) return;
    const overlay=document.createElement("div"); overlay.className="overlay";
    overlay.innerHTML=`<div class="modal" style="width:420px"><h3>批量删除</h3><div class="sub">确定删除选中的 ${ids.length} 条记录？此操作不可撤销。</div>
      <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
    document.body.appendChild(overlay);
    const close=()=>overlay.remove();
    overlay.onclick=e=>{ if(e.target===overlay) close(); };
    overlay.querySelector("#c-cancel").onclick=close;
    overlay.querySelector("#c-ok").onclick=()=>{ data[key]=data[key].filter(x=>!sel.has(x.id)); sel.clear(); persist(); close(); };
  };
  const exportBtn=$("#btn-export");
  if(exportBtn) exportBtn.onclick=()=>exportSelectedAsTxt(key);
  // 排序切换
  $("#screen").querySelectorAll("[data-sort]").forEach(el=>el.onclick=()=>{
    sortMode=el.dataset.sort; renderModule(key);
  });
}

/* 导出选中记录为TXT */
function exportSelectedAsTxt(key){
  const sel=getBatchSet(key); const ids=[...sel];
  if(!ids.length) return;
  const m=modOf(key);
  const records=ids.map(id=>(data[key]||[]).find(x=>x.id===id)).filter(Boolean);
  const lines=records.map((r,i)=>{
    const parts=[`【${i+1}】${r.title||'无标题'}`];
    if(r.date) parts.push(`日期：${r.date}`);
    if(r.mood) parts.push(`分类：${r.mood}`);
    const fields=m.fields||[];
    fields.forEach(f=>{ if(r[f.key]) parts.push(`${f.label}：${r[f.key]}`); });
    const body=r.content||r.note||'';
    if(body) parts.push(`\n${body}`);
    return parts.join('\n');
  });
  const header=`${m.name} - 导出记录\n导出时间：${new Date().toLocaleString('zh-CN')}\n选中：${records.length} 条\n${'='.repeat(50)}\n\n`;
  const txt=header+lines.join('\n\n'+'-'.repeat(50)+'\n\n');
  const blob=new Blob([txt],{type:'text/plain;charset=utf-8'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');
  a.href=url; a.download=`${m.name}_导出_${new Date().toISOString().slice(0,10)}.txt`;
  a.click(); URL.revokeObjectURL(url);
  showToast(`已导出 ${records.length} 条记录`);
}

/* ---------- EDITOR MODAL (per type) ---------- */
function openEditor(key,item){
  const m=modOf(key); const editing=!!item; const d=item||newItem(m);
  let fields="";
  if(m.type==="todo"){
    fields=`<div class="field"><label>任务</label><input id="f-title" value="${attr(d.title)}" placeholder="要做什么？"/></div>
      <div class="field"><label>优先级</label><div class="seg" id="f-prio">${(m.priorities||[]).map(p=>`<div class="opt ${p.key===d.priority?'on':''}" data-v="${p.key}">${p.label}</div>`).join("")}</div></div>
      <div class="field"><label>备注</label><textarea id="f-note" placeholder="补充说明">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="checkin"){
    fields=`<div class="field"><label>打卡项</label><input id="f-title" value="${attr(d.title)}" placeholder="例如：喝够 8 杯水"/></div>
      <p class="sub" style="margin:0">保存后可在卡片点击左侧方块打卡；连续天数自动统计，每天从零开始。</p>`;
  } else if(m.type==="progress"){
    fields=`<div class="field"><label>名称</label><input id="f-title" value="${attr(d.title)}" placeholder="书名 / 目标"/></div>
      <div class="frow"><div class="field"><label>当前</label><input id="f-cur" type="number" value="${d.current??0}"/></div>
      <div class="field"><label>目标</label><input id="f-tgt" type="number" value="${d.target??1}"/></div>
      <div class="field"><label>单位</label><input id="f-unit" value="${attr(d.unit||m.unit||'')}"/></div></div>
      <div class="field"><label>摘录 / 想法</label><textarea id="f-note" placeholder="随手记">${esc(d.note||'')}</textarea></div>`;
  } else if(m.type==="finance"){
    fields=`<div class="field"><label>类型</label><div class="seg" id="f-ftype">
        <div class="opt ${d.type!=='income'?'on':''}" data-v="expense">支出</div><div class="opt ${d.type==='income'?'on':''}" data-v="income">收入</div></div></div>
      <div class="frow"><div class="field"><label>项目</label><input id="f-title" value="${attr(d.title)}" placeholder="午餐 / 稿费"/></div>
      <div class="field"><label>金额 ¥</label><input id="f-amt" type="number" value="${d.amount??''}" placeholder="0"/></div></div>
      <div class="field"><label>分类</label><div class="seg" id="f-cat">${(m.categories||[]).map(c=>`<div class="opt ${c===d.category?'on':''}" data-v="${attr(c)}" style="flex:0 0 auto;min-width:auto">${esc(c)}</div>`).join("")}</div></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  } else {
    fields=`<div class="field"><label>标题</label><input id="f-title" value="${attr(d.title)}" placeholder="给这条起个名"/></div>
      ${(m.moods&&m.moods.length)?`<div class="field"><label>标签 / 心情</label><div class="seg" id="f-mood">${m.moods.map(md=>`<div class="opt ${md===d.mood?'on':''}" data-v="${attr(md)}" style="flex:0 0 auto;min-width:auto">${md}</div>`).join("")}</div></div>`:''}
      <div class="field"><label>内容</label><textarea id="f-content" placeholder="写点什么…">${esc(d.content||'')}</textarea></div>
      <div class="field"><label>日期</label><input id="f-date" type="date" value="${d.date||isoToday()}"/></div>`;
  }
  // layout variant selector
  const layoutOpts=[{v:'default',l:'标准'},{v:'feature',l:'大图'},{v:'quote',l:'引文'}];
  fields=`<div class="field"><label>卡片样式</label><div class="seg" id="f-layout">${layoutOpts.map(o=>`<div class="opt ${o.v===(d.layout||'default')?'on':''}" data-v="${o.v}">${o.l}</div>`).join("")}</div></div>`+fields;
  // custom fields (from m.fields config) — rendered after type-specific fields
  (m.fields||[]).forEach(f=>{
    const v=d[f.key]||"";
    if(f.type==="select") fields+=`<div class="field"><label>${esc(f.label)}</label><div class="seg" id="f-cf-${f.key}">${(f.options||[]).map(o=>`<div class="opt ${o===v?'on':''}" data-v="${attr(o)}" style="flex:0 0 auto;min-width:auto">${esc(o)}</div>`).join("")}</div></div>`;
    else if(f.type==="textarea") fields+=`<div class="field"><label>${esc(f.label)}</label><textarea id="f-cf-${f.key}" placeholder="${attr(f.placeholder||'')}">${esc(v)}</textarea></div>`;
    else if(f.type==="number") fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" type="number" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
    else fields+=`<div class="field"><label>${esc(f.label)}</label><input id="f-cf-${f.key}" value="${attr(v)}" placeholder="${attr(f.placeholder||'')}"/></div>`;
  });
  // shared image URL field (all types)
  fields+=`<div class="field"><label>图片 URL（可选）</label><input id="f-image" value="${attr(d.image||'')}" placeholder="https://..."/></div>`;
  const overlay=document.createElement("div"); overlay.className="overlay";
  const scriptActions = key==="script" ? `<button class="btn ghost" id="m-gen-all" style="background:rgba(110,197,160,0.12);color:#4a8c6a;border-color:rgba(110,197,160,0.3)">一键生成配套文案</button>` : '';
  overlay.innerHTML=`<div class="modal"><h3>${editing?'编辑':'新建'} · ${m.name}</h3><div class="sub">${m.desc}</div>${fields}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      ${scriptActions}
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{ seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on"); }));
  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmDelete(key,d.id); };
  // 一键生成配套文案（仅脚本模块）
  const genBtn=overlay.querySelector("#m-gen-all");
  if(genBtn) genBtn.onclick=()=>{
    // 先保存当前脚本数据
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    d.mood=seg("#f-mood")||d.mood||"";
    d.content=(val("#f-content")||"").trim();
    d.date=val("#f-date");
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);

    // 解析标题备选
    const titleOpts=(d.titleOptions||"").split(/\n/).map(s=>s.replace(/^\d+\.\s*/,'').trim()).filter(Boolean);
    // 解析封面文案
    const coverMain=(d.coverText||"").match(/主标题[：:]\s*([^\/\n]+)/);
    const coverSub=(d.coverText||"").match(/副标题[：:]\s*(.+)/);

    // 1. 生成标题记录
    if(titleOpts.length){
      const titleItem={
        id:Date.now(),title:titleOpts[0]||d.title,mood:d.mood||"今日推荐",date:isoToday(),pinned:false,
        platform:"全平台",hookType:"提问",
        title1:titleOpts[0]||"",title2:titleOpts[1]||"",title3:titleOpts[2]||"",
      };
      (data.titles=data.titles||[]).unshift(titleItem);
    }
    // 2. 生成口播文案记录
    const voiceText=[d.hook,d.expand,d.sellingPoint,d.cta].filter(Boolean).join("\n\n");
    if(voiceText){
      const voiceItem={
        id:Date.now()+1,title:d.title+" - 口播台词",mood:d.mood||"今日推荐",date:isoToday(),pinned:false,
        content:voiceText,
      };
      (data.voice=data.voice||[]).unshift(voiceItem);
    }
    // 3. 生成封面文案记录
    if(coverMain||coverSub){
      const coverItem={
        id:Date.now()+2,title:`${coverMain?coverMain[1].trim():d.title} / ${coverSub?coverSub[1].trim():''}`,
        mood:d.mood||"今日推荐",date:isoToday(),pinned:false,
        mainTitle:coverMain?coverMain[1].trim():d.title,
        subTitle:coverSub?coverSub[1].trim():"",
        designNote:"",fontStyle:"粗黑体",
      };
      (data.cover=data.cover||[]).unshift(coverItem);
    }
    // 4. 生成置顶评论文案记录（存入口播模块，标注为置顶评论）
    if(d.topComment){
      const commentItem={
        id:Date.now()+3,title:d.title+" - 置顶评论",mood:d.mood||"今日推荐",date:isoToday(),pinned:false,
        content:d.topComment,
      };
      (data.voice=data.voice||[]).unshift(commentItem);
    }

    persist(); close();
    showToast("已生成配套文案：标题"+(titleOpts.length?"✓":"")+" · 口播"+(voiceText?"✓":"")+" · 封面"+(coverMain||coverSub?"✓":"")+" · 置顶评论"+(d.topComment?"✓":""));
  };
  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    d.title=(val("#f-title")||"").trim()||"未命名";
    d.layout=seg("#f-layout")||'default';
    if(m.type==="todo"){ d.priority=seg("#f-prio")||d.priority; d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="progress"){ d.current=Math.max(0,+val("#f-cur")||0); d.target=Math.max(1,+val("#f-tgt")||1); d.unit=(val("#f-unit")||"").trim(); d.note=(val("#f-note")||"").trim(); }
    else if(m.type==="finance"){ d.type=seg("#f-ftype")||"expense"; d.amount=Math.max(0,+val("#f-amt")||0); d.category=seg("#f-cat")||(m.categories&&m.categories[0])||"其他"; d.date=val("#f-date"); }
    else if(m.type==="note"){ d.mood=seg("#f-mood")||d.mood||""; d.content=(val("#f-content")||"").trim(); d.date=val("#f-date"); }
    // save custom fields
    (m.fields||[]).forEach(f=>{
      if(f.type==="select") d[f.key]=seg("#f-cf-"+f.key)||d[f.key]||"";
      else if(f.type==="number") d[f.key]=Math.max(0,+val("#f-cf-"+f.key)||0);
      else d[f.key]=(val("#f-cf-"+f.key)||"").trim();
    });
    // save image
    d.image=(val("#f-image")||"").trim();
    if(!editing) (data[key]=data[key]||[]).unshift(d);
    persist(); close();
  };
}

function newItem(m){ const base={id:Date.now()}; let item;
  if(m.type==="todo") item={...base,title:"",priority:(m.priorities&&m.priorities[1]?m.priorities[1].key:"P1"),done:false,note:""};
  else if(m.type==="checkin") item={...base,title:"",log:{}};
  else if(m.type==="progress") item={...base,title:"",current:0,target:(m.unit==="页"?100:20),unit:m.unit||"",note:""};
  else if(m.type==="finance") item={...base,title:"",type:"expense",amount:"",category:(m.categories&&m.categories[0])||"其他",date:isoToday()};
  else item={...base,title:"",content:"",mood:(m.moods&&m.moods[0])||"",date:isoToday()};
  // initialize custom fields
  (m.fields||[]).forEach(f=>{ if(!(f.key in item)) item[f.key]= f.type==="select"?(f.options&&f.options[0]||""):""; });
  return item;
}

/* 爆款库 → 选题池：从爆款拆解中提炼可复用选题 */
function convertToTopic(hotlibId){
  const hot=(data.hotlib||[]).find(h=>h.id===hotlibId); if(!hot) return;
  // 检查是否已转换
  const existing=(data.topic||[]).find(t=>t.hotlibId==String(hotlibId));
  if(existing){
    const ov=document.createElement("div"); ov.className="overlay";

      <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">关闭</button><button class="btn" id="c-go">跳转选题池</button></div></div>`;
    document.body.appendChild(ov);
    ov.onclick=e=>{ if(e.target===ov) ov.remove(); };

    ov.querySelector("#c-go").onclick=()=>{ ov.remove(); go("topic"); };

  const angleMatch=content.match(/【可复用逻辑】([^\n]+)/);

  const typeMatch=content.match(/【爆款类型】([^\n]+)/);

  const newTopic={
    id: Date.now(),

    pinned: false,
    content: `【选题来源】爆款库 #${hot.id}：${hot.title}\n【爆款类型】${typeMatch?typeMatch[1]:'未分类'}\n【核心钩子】${hookMatch?hookMatch[1]:'待提炼'}\n【可复用逻辑】${angleMatch?angleMatch[1]:'待补充'}\n\n【选题角度】待确认（清单/对比/案例/误区/实测/流程/跟练）\n【目标受众】待确认\n【业务价值】待评估（高/中/低）\n【风险等级】待评估\n【卖点植入思路】待补充`,
    source: "爆款拆解",
    angle: "",
    riskLevel: "低",
    topicStatus: "待写脚本",
    hotlibId: String(hotlibId),
    scriptId: "",
  };

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:520px">
    <h3>爆款转选题</h3>
    <div class="sub">从爆款「${esc(hot.title.slice(0,30))}」提炼选题，可编辑后保存到选题池</div>
    <div class="field"><label>选题标题</label><input id="ct-title" value="${attr(newTopic.title)}"/></div>
    <div class="frow">
      <div class="field"><label>分级</label><div class="seg" id="ct-mood">
        ${["当周必拍","备选","长期储备"].map(m=>`<div class="opt ${m===newTopic.mood?'on':''}" data-v="${m}">${m}</div>`).join("")}
      </div></div>
      <div class="field"><label>内容角度</label><div class="seg" id="ct-angle">
        ${["清单","对比","案例","误区","实测","流程","跟练"].map(a=>`<div class="opt" data-v="${a}">${a}</div>`).join("")}
      </div></div>
    </div>
    <div class="frow">
      <div class="field"><label>风险等级</label><div class="seg" id="ct-risk">
        ${["低","中","高"].map(r=>`<div class="opt ${r===newTopic.riskLevel?'on':''}" data-v="${r}">${r}</div>`).join("")}
      </div></div>
      <div class="field"><label>状态</label><div class="seg" id="ct-status">
        ${["待写脚本","待拍摄","已拍摄","已发布","复盘中"].map(s=>`<div class="opt ${s===newTopic.topicStatus?'on':''}" data-v="${s}">${s}</div>`).join("")}
      </div></div>
    </div>

  }));

/* 选题池 → 脚本生成：基于选题一键生成脚本草稿 */
function generateScriptFromTopic(topicId){
  const topic=(data.topic||[]).find(t=>t.id===topicId); if(!topic) return;

  // 如果已有关联脚本，直接跳转查看
  if(topic.scriptId){
    const script=(data.script||[]).find(s=>s.id==topic.scriptId);
    if(script){ viewScript(script.id); return; }
  }

  // 从选题内容中提取信息生成脚本
  const content=topic.content||"";
  const angleText=topic.angle?`【内容角度】${topic.angle}\n`:'';
  const sourceText=topic.source?`【选题来源】${topic.source}\n`:'';

  // 根据选题角度推荐脚本结构
  let scriptTemplate="";
  const angle=topic.angle||"";
  if(angle==="对比"){
    scriptTemplate=`【钩子 0-5秒】\n（对比开场，制造反差）\n\n【展开 5-18秒】\n（逐维度对比拆解，3个核心差异点）\n\n【卖点植入 18-25秒】\n（在对比中自然引出健身房/私教课优势）\n\n【行动号召 25-30秒】\n（评论区互动引导）`;
  } else if(angle==="误区"){
    scriptTemplate=`【钩子 0-5秒】\n（抛出常见误区，制造认知冲突）\n\n【展开 5-18秒】\n（逐条拆解误区，给出正确做法）\n\n【卖点植入 18-25秒】\n（正确做法中自然带出健身房/课程价值）\n\n【行动号召 25-30秒】\n（评论区互动引导）`;
  } else if(angle==="清单"){
    scriptTemplate=`【钩子 0-5秒】\n（清单式开场：N件事/N个细节）\n\n【展开 5-18秒】\n（逐条列举，每条8-10秒）\n\n【卖点植入 18-25秒】\n（在清单中反向植入办卡/课程卖点）\n\n【行动号召 25-30秒】\n（评论区互动引导）`;
  } else if(angle==="案例"){
    scriptTemplate=`【钩子 0-5秒】\n（案例引入，展示结果）\n\n【展开 5-18秒】\n（过程拆解：起点→转折→改变）\n\n【卖点植入 18-25秒】\n（转折点自然出现健身房/教练）\n\n【行动号召 25-30秒】\n（评论区互动引导）`;
  } else {
    scriptTemplate=`【钩子 0-5秒】\n（3秒内抓住注意力）\n\n【展开 5-18秒】\n（核心内容展开）\n\n【卖点植入 18-25秒】\n（自然植入健身卡/课程卖点）\n\n【行动号召 25-30秒】\n（评论区互动引导）`;
  }

  const newScript={
    id: Date.now(),
    title: topic.title,
    mood: "今日推荐",
    date: isoToday(),
    pinned: false,
    content: `【适配时长】30秒\n【主推产品】健身卡 / 健身课程\n${sourceText}${angleText}【选题ID】${topic.id}\n\n${scriptTemplate}\n\n【标题备选】\n1. ${topic.title}\n2. 待补充\n3. 待补充\n\n【封面文案】主标题：待补充 / 副标题：待补充\n\n【置顶评论】待补充`,
  };

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:560px">
    <h3>生成脚本</h3>
    <div class="sub">基于选题「${esc(topic.title.slice(0,30))}」生成脚本草稿，${topic.angle?`按「${topic.angle}」结构模板`:'使用通用模板'}，可编辑后保存</div>
    <div class="field"><label>脚本标题</label><input id="gs-title" value="${attr(newScript.title)}"/></div>
    <div class="field"><label>标签</label><div class="seg" id="gs-mood">
      ${["今日推荐","办卡避坑","减脂","增肌","私教课","新手入门","团课体验"].map(m=>`<div class="opt ${m===newScript.mood?'on':''}" data-v="${m}">${m}</div>`).join("")}
    </div></div>
    <div class="field"><label>脚本内容（可编辑）</label><textarea id="gs-content" style="min-height:280px;font-family:inherit">${esc(newScript.content)}</textarea></div>
    <div class="modal-actions"><div class="spacer"></div>
      <button class="btn ghost" id="gs-cancel">取消</button>
      <button class="btn" id="gs-save">保存到脚本库</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelectorAll(".seg").forEach(seg=>seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
    seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on")); o.classList.add("on");
  }));
  overlay.querySelector("#gs-cancel").onclick=close;
  overlay.querySelector("#gs-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const seg=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    newScript.title=(val("#gs-title")||"").trim()||"未命名脚本";
    newScript.mood=seg("#gs-mood")||"今日推荐";
    newScript.content=(val("#gs-content")||"").trim();
    data.script=data.script||[];
    data.script.unshift(newScript);
    // 回填选题的 scriptId
    topic.scriptId=String(newScript.id);
    topic.topicStatus="待拍摄";
    persist(); close();
    // 提示成功
    showToast(`脚本已保存到脚本库，选题状态已更新为「待拍摄」`);
    setTimeout(()=>go("script"),300);
  };
}

/* ---------- 数据管理：备份/恢复/清空 ---------- */
$("#btn-data-mgmt").onclick = openDataMgmt;

function getDataSize(){
  const raw = localStorage.getItem(CONFIG.storageKey) || "";
  return raw.length;
}
function formatSize(bytes){
  if(bytes < 1024) return bytes + " B";
  if(bytes < 1024*1024) return (bytes/1024).toFixed(1) + " KB";
  return (bytes/1024/1024).toFixed(2) + " MB";
}

function openDataMgmt(){
  const size = getDataSize();
  const max = 5*1024*1024;
  const pct = Math.min(100, Math.round(size/max*100));
  const recCount = CONFIG.modules.reduce((s,m)=>s+((data[m.key]||[]).length),0);
  const schedCount = (data.schedule||[]).length;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:480px">
    <h3>数据管理</h3>
    <div class="sub">所有数据保存在浏览器本地存储，不会上传到云端。建议定期导出备份。</div>

    <div class="dm-section">
      <div class="dm-label">存储使用</div>
      <div class="dm-bar-wrap"><div class="dm-bar" style="width:${pct}%"></div></div>
      <div class="dm-bar-info">
        <span>${formatSize(size)} / 5 MB</span>
        <span>${pct}%</span>
      </div>
      <div class="dm-stats">
        <div class="dm-stat"><div class="dm-stat-v">${recCount}</div><div class="dm-stat-l">模块记录</div></div>
        <div class="dm-stat"><div class="dm-stat-v">${schedCount}</div><div class="dm-stat-l">排期任务</div></div>
      </div>
    </div>

    <div class="dm-section">
      <div class="dm-label">导出备份</div>
      <button class="btn" id="dm-export" style="width:100%">${icon("download",16,2.2)}导出全部数据为 JSON 文件</button>
    </div>

    <div class="dm-section">
      <div class="dm-label">导入恢复</div>
      <input type="file" id="dm-import-input" accept=".json" hidden/>
      <button class="btn ghost" id="dm-import-btn" style="width:100%">选择 JSON 文件导入</button>
      <div class="dm-warn">导入会覆盖当前所有数据，请先导出备份</div>
    </div>

    <div class="dm-section">
      <div class="dm-label">重置</div>
      <button class="btn danger" id="dm-clear" style="width:100%">${icon("trash",16,2.2)}清空所有数据（恢复初始状态）</button>
    </div>

    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="dm-close">关闭</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#dm-close").onclick=close;

  // 导出
  overlay.querySelector("#dm-export").onclick=()=>{
    const raw = localStorage.getItem(CONFIG.storageKey) || "{}";
    const blob = new Blob([raw], {type:"application/json;charset=utf-8"});
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `健身房工作台_备份_${new Date().toISOString().slice(0,10)}.json`;
    a.click();
    URL.revokeObjectURL(url);
    showToast("已导出备份文件");
  };

  // 导入
  const importInput = overlay.querySelector("#dm-import-input");
  overlay.querySelector("#dm-import-btn").onclick=()=>importInput.click();
  importInput.onchange=e=>{
    const f = e.target.files && e.target.files[0];
    if(!f) return;
    const reader = new FileReader();
    reader.onload = () => {
      try {
        const parsed = JSON.parse(reader.result);
        if(typeof parsed !== "object" || parsed === null) throw new Error("格式错误");
        // 二次确认
        const c2 = document.createElement("div"); c2.className="overlay";
        c2.innerHTML=`<div class="modal" style="width:380px"><h3>确认导入</h3>
          <div class="sub">导入将覆盖当前所有数据，此操作不可撤销。确定继续？</div>
          <div class="modal-actions"><div class="spacer"></div>
          <button class="btn ghost" id="i-cancel">取消</button>
          <button class="btn danger" id="i-ok">确认导入</button></div></div>`;
        document.body.appendChild(c2);
        c2.querySelector("#i-cancel").onclick=()=>c2.remove();
        c2.querySelector("#i-ok").onclick=()=>{
          localStorage.setItem(CONFIG.storageKey, JSON.stringify(parsed));
          data = store.load();
          close(); c2.remove();
          go("home");
          showToast("数据导入成功");
        };
        c2.onclick=e=>{ if(e.target===c2) c2.remove(); };
      } catch(err) {
        showToast("导入失败：文件格式不正确");
      }
    };
    reader.readAsText(f);
    e.target.value = "";
  };

  // 清空
  overlay.querySelector("#dm-clear").onclick=()=>{
    const c2 = document.createElement("div"); c2.className="overlay";
    c2.innerHTML=`<div class="modal" style="width:380px"><h3>清空所有数据</h3>
      <div class="sub">将删除所有自定义内容，恢复为初始示例数据。此操作不可撤销，建议先导出备份。</div>
      <div class="modal-actions"><div class="spacer"></div>
      <button class="btn ghost" id="c-cancel">取消</button>
      <button class="btn danger" id="c-ok">确认清空</button></div></div>`;
    document.body.appendChild(c2);
    c2.querySelector("#c-cancel").onclick=()=>c2.remove();
    c2.querySelector("#c-ok").onclick=()=>{
      localStorage.removeItem(CONFIG.storageKey);
      data = store.load();
      close(); c2.remove();
      go("home");
      showToast("已恢复初始状态");
    };
    c2.onclick=e=>{ if(e.target===c2) c2.remove(); };
  };
}

/* ---------- utils ---------- */
function esc(s){ return String(s??"").replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function attr(s){ return esc(s).replace(/"/g,'&quot;'); }

/* ============================================================
   每日排期视图 — SCHEDULE VIEW
   ============================================================ */
const SCHED_STATUS = [
  {key:"edit",label:"待编辑",cls:"st-edit"},
  {key:"gen",label:"已生成",cls:"st-gen"},
  {key:"ready",label:"待发布",cls:"st-ready"},
  {key:"pub",label:"已发布",cls:"st-pub"},
];
const SCHED_PLATFORMS = ["抖音","B站","小红书"];
const SCHED_TOPICS = ["办卡避坑","减脂","增肌","私教课","新手入门","团课体验","健身饮食","体态矫正","碎片化健身","器械对比","行业趋势","教练IP"];

function schedWeekDates(offset){
  const n=new Date(); const dow=(n.getDay()+6)%7; const mon=new Date(n); mon.setDate(n.getDate()-dow+offset*7);
  const arr=[]; for(let i=0;i<7;i++){ const d=new Date(mon); d.setDate(mon.getDate()+i); arr.push(d); }
  return arr;
}
function schedDateISO(d){ return d.toISOString().slice(0,10); }
function schedDateLabel(d){ return `${d.getMonth()+1}/${d.getDate()}`; }
function schedDayLabel(d){ return "日一二三四五六"[d.getDay()]; }

function renderSchedule(){
  const tasks = data.schedule||[];
  const todayISO = isoToday();

  // 统计
  const total = tasks.length;
  const published = tasks.filter(t=>t.status==="pub").length;
  const ready = tasks.filter(t=>t.status==="ready").length;
  const gen = tasks.filter(t=>t.status==="gen").length;

  const headHTML = `<div class="hero">
    <div class="hero-ic" style="background:var(--accent-muted);width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;color:var(--accent)">${icon("calendar",24,2)}</div>
    <div class="hero-tx"><div class="hero-row">
      <span class="hero-v">${total}</span><span class="hero-l">条排期任务 · 已发布${published} · 待发布${ready} · 已生成${gen}</span>
    </div></div></div>`;

  const toolbar = `<div class="sched-toolbar">
    <div class="sched-nav-btn" id="sched-prev">${icon("chevron",16,2.2)}</div>
    <div class="sched-week-label" id="sched-label">${schedWeekLabel()}</div>
    <div class="sched-nav-btn" id="sched-next" style="transform:rotate(180deg)">${icon("chevron",16,2.2)}</div>
    <button class="btn" id="sched-today" style="margin-left:6px">${icon("calendar",14,2.2)}今天</button>
    <div class="sched-view-toggle">
      <div class="vt-btn ${schedView==='week'?'on':''}" data-sv="week">周视图</div>
      <div class="vt-btn ${schedView==='list'?'on':''}" data-sv="list">列表视图</div>
    </div>
    <button class="btn" id="sched-add">${icon("plus",16,2.2)}新建任务</button>
    <button class="btn ghost" id="sched-ai-suggest" style="background:rgba(168,85,247,.1);color:#7c3aed;border-color:rgba(168,85,247,.3)">${icon("bolt",14,2.2)}排期建议</button>
  </div>`;

  let bodyHTML;
  if(schedView==="week"){
    bodyHTML = renderSchedWeek(tasks, todayISO);
  } else {
    bodyHTML = renderSchedList(tasks);
  }

  $("#screen").innerHTML = `<div class="header"><div><h2>每日排期</h2><p>按日期可视化展示运营工作 · 任务管理 · 脚本绑定 · 数据回填</p></div><div class="spacer"></div><span class="date-chip">${icon("calendar",14)} ${dateStr()}</span></div>
    ${headHTML}
    ${toolbar}
    ${bodyHTML}`;

  wireSchedule();
}

function schedWeekLabel(){
  const days = schedWeekDates(schedWeekOffset);
  const s = days[0], e = days[6];
  return `${s.getFullYear()}年${s.getMonth()+1}月${s.getDate()}日 - ${e.getMonth()+1}月${e.getDate()}日`;
}

function renderSchedWeek(tasks, todayISO){
  const days = schedWeekDates(schedWeekOffset);
  const cols = days.map(d=>{
    const iso = schedDateISO(d);
    const dayTasks = tasks.filter(t=>t.date===iso);
    const isToday = iso===todayISO;
    const cards = dayTasks.map(t=>schedTaskCard(t)).join("");
    return `<div class="sched-day-col">
      <div class="sched-day-head ${isToday?'today':''}">
        <span class="dw">周${schedDayLabel(d)}</span>
        <span class="dd">${schedDateLabel(d)}</span>
      </div>
      <div class="sched-day-body">
        ${cards}
        <button class="sched-add-btn" data-add-date="${iso}">${icon("plus",12,2.2)} 添加任务</button>
      </div>
    </div>`;
  }).join("");
  return `<div class="sched-week">${cols}</div>`;
}

function renderSchedList(tasks){
  // 按日期排序
  const sorted = [...tasks].sort((a,b)=>(a.date||"").localeCompare(b.date||""));
  if(!sorted.length) return `<div class="empty"><div style="color:var(--text-tertiary);margin-bottom:8px">${icon("calendar",32,1.5)}</div><div>还没有排期任务，点击「新建任务」添加</div></div>`;
  const rows = sorted.map(t=>{
    const d = new Date(t.date+"T00:00:00");
    const st = SCHED_STATUS.find(s=>s.key===t.status)||SCHED_STATUS[0];
    const platBadges = (t.platforms||[]).map(p=>`<span class="tc-badge plat">${esc(p)}</span>`).join("");
    const analytics = t.analytics ? `<div class="sl-analytics">
      <div class="sa-item"><div class="sa-v">${t.analytics.views||0}</div><div class="sa-l">播放</div></div>
      <div class="sa-item"><div class="sa-v">${t.analytics.likes||0}</div><div class="sa-l">点赞</div></div>
      <div class="sa-item"><div class="sa-v">${t.analytics.leads||0}</div><div class="sa-l">线索</div></div>
    </div>` : "";
    return `<div class="sched-list-row" data-edit-sched="${t.id}">
      <div class="sl-date"><div class="sl-d">${d.getDate()}</div><div class="sl-w">${d.getMonth()+1}月 周${schedDayLabel(d)}</div></div>
      <div class="sl-body">
        <div class="sl-topic">${esc(t.topic||'未命名')}</div>
        <div class="sl-summary">${esc(t.summary||'')}</div>
        <div class="sl-badges"><span class="tc-badge ${st.cls}">${st.label}</span>${platBadges}${t.scriptId?'<span class="tc-badge plat">已绑定脚本</span>':''}</div>
      </div>
      ${analytics}
    </div>`;
  }).join("");
  return `<div class="sched-list">${rows}</div>`;
}

function schedTaskCard(t){
  const st = SCHED_STATUS.find(s=>s.key===t.status)||SCHED_STATUS[0];
  const platBadges = (t.platforms||[]).map(p=>`<span class="tc-badge plat">${esc(p)}</span>`).join("");
  const viewScriptBtn = t.scriptId ? `<button class="tc-view-script" data-view-script="${t.scriptId}">${icon("eye",12,2.2)} 查看脚本</button>` : '';
  return `<div class="task-card" data-edit-sched="${t.id}">
    <div class="tc-del" data-del-sched="${t.id}">${icon("close",12,2.2)}</div>
    <div class="tc-topic">${esc(t.topic||'未命名')}</div>
    ${t.summary?`<div class="tc-summary">${esc(t.summary)}</div>`:''}
    <div class="tc-badges"><span class="tc-badge ${st.cls}">${st.label}</span>${platBadges}${t.scriptId?'<span class="tc-badge plat">脚本</span>':''}</div>
    ${viewScriptBtn}
  </div>`;
}

function wireSchedule(){
  // 视图切换
  $("#screen").querySelectorAll("[data-sv]").forEach(el=>el.onclick=()=>{ schedView=el.dataset.sv; renderSchedule(); });
  // 周导航
  const prev=$("#sched-prev"); if(prev) prev.onclick=()=>{ schedWeekOffset--; renderSchedule(); };
  const next=$("#sched-next"); if(next) next.onclick=()=>{ schedWeekOffset++; renderSchedule(); };
  const today=$("#sched-today"); if(today) today.onclick=()=>{ schedWeekOffset=0; renderSchedule(); };
  // 新建任务
  const add=$("#sched-add"); if(add) add.onclick=()=>openSchedEditor(null);
  // 排期建议
  const ai=$("#sched-ai-suggest"); if(ai) ai.onclick=()=>aiSuggestDates();
  // 按日期添加
  $("#screen").querySelectorAll("[data-add-date]").forEach(el=>el.onclick=()=>openSchedEditor(null, el.dataset.addDate));
  // 编辑任务
  $("#screen").querySelectorAll("[data-edit-sched]").forEach(el=>el.onclick=e=>{
    if(e.target.closest("[data-del-sched]")) return;
    const t=(data.schedule||[]).find(x=>x.id==el.dataset.editSched);
    if(t) openSchedEditor(t);
  });
  // 删除任务
  $("#screen").querySelectorAll("[data-del-sched]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    const id=+el.dataset.delSched;
    confirmSchedDelete(id);
  });
  // 查看脚本
  $("#screen").querySelectorAll("[data-view-script]").forEach(el=>el.onclick=e=>{
    e.stopPropagation();
    viewScript(+el.dataset.viewScript);
  });
}

/* ---------- 排期编辑器 ---------- */
function openSchedEditor(item, defaultDate){
  const editing=!!item;
  const d = item ? structuredClone(item) : {
    id: Date.now(),
    date: defaultDate||isoToday(),
    topic: "",
    platforms: ["抖音"],
    status: "edit",
    scriptId: null,
    summary: "",
    analytics: null,
  };

  // 获取可绑定的脚本列表
  const scripts = data.script||[];
  const scriptList = scripts.map(s=>{
    const bound = d.scriptId===s.id;
    return `<div class="bind-script-item ${bound?'bound':''}" data-bind-id="${s.id}">
      <span class="bsi-title">${esc(s.title||'未命名')}</span>
      <span class="bsi-tag">${esc(s.mood||'')}</span>
      ${bound?'<span style="color:var(--accent);font-size:11px">✓ 已绑定</span>':''}
    </div>`;
  }).join("");

  const statusOpts = SCHED_STATUS.map(s=>`<div class="opt ${s.key===d.status?'on':''}" data-v="${s.key}">${s.label}</div>`).join("");
  const platOpts = SCHED_PLATFORMS.map(p=>{
    const on = (d.platforms||[]).includes(p);
    return `<div class="opt ${on?'on':''}" data-v="${p}" data-plat="1" style="flex:0 0 auto;min-width:auto">${p}</div>`;
  }).join("");
  const topicOpts = SCHED_TOPICS.map(t=>`<div class="opt ${t===d.topic?'on':''}" data-v="${esc(t)}" style="flex:0 0 auto;min-width:auto">${t}</div>`).join("");

  // 分析数据回填区
  const a = d.analytics||{};
  const analyticsHTML = d.status==="pub" ? `
    <div class="sched-editor-sec">
      <div class="ses-title">发布数据回填</div>
      <div class="analytics-fill">
        <div class="af-item"><label>播放量</label><input id="f-views" type="number" value="${a.views||''}" placeholder="0"/></div>
        <div class="af-item"><label>完播率%</label><input id="f-completionRate" type="number" value="${a.completionRate||a.complete||''}" placeholder="0"/></div>
        <div class="af-item"><label>点赞数</label><input id="f-likes" type="number" value="${a.likes||''}" placeholder="0"/></div>
        <div class="af-item"><label>评论数</label><input id="f-comments" type="number" value="${a.comments||''}" placeholder="0"/></div>
        <div class="af-item"><label>分享数</label><input id="f-shares" type="number" value="${a.shares||''}" placeholder="0"/></div>
        <div class="af-item"><label>收藏数</label><input id="f-collects" type="number" value="${a.collects||a.favs||''}" placeholder="0"/></div>
        <div class="af-item"><label>私信咨询</label><input id="f-dms" type="number" value="${a.dms||a.leads||''}" placeholder="0"/></div>
        <div class="af-item"><label>线索转化</label><input id="f-leads" type="number" value="${a.leads||''}" placeholder="0"/></div>
        <div class="af-item"><label>健身卡成交</label><input id="f-cardSold" type="number" value="${a.cardSold||''}" placeholder="0"/></div>
        <div class="af-item"><label>课程成交</label><input id="f-courseSold" type="number" value="${a.courseSold||''}" placeholder="0"/></div>
      </div>
    </div>` : `<div class="sched-editor-sec"><div class="ses-title" style="color:var(--text-tertiary)">发布后将视频状态改为「已发布」可回填数据</div></div>`;

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="max-width:560px">
    <h3>${editing?'编辑':'新建'}排期任务</h3>
    <div class="sub">按日期管理视频发布计划，绑定脚本，回填数据</div>
    <div class="field"><label>视频主题</label><div class="seg" id="f-topic">${topicOpts}</div></div>
    <div class="field"><label>自定义主题（可选）</label><input id="f-topic-custom" value="${attr(d.topic)}" placeholder="输入自定义主题"/></div>
    <div class="frow">
      <div class="field"><label>发布日期</label><input id="f-date" type="date" value="${d.date}"/></div>
      <div class="field"><label>状态</label><div class="seg" id="f-status">${statusOpts}</div></div>
    </div>
    <div class="field"><label>发布平台</label><div class="seg" id="f-plat">${platOpts}</div></div>
    <div class="field"><label>脚本摘要预览</label><textarea id="f-summary" placeholder="视频脚本摘要，可从绑定的脚本自动填充">${esc(d.summary||'')}</textarea></div>
    <div class="sched-editor-sec">
      <div class="ses-title">绑定素材脚本</div>
      <div class="bind-script-list" id="f-bindlist">${scriptList||'<div style="color:var(--text-tertiary);font-size:12.5px;padding:6px 0">暂无可绑定脚本，请先在「脚本生成」模块创建</div>'}</div>
    </div>
    ${analyticsHTML}
    <div class="modal-actions">${editing?'<button class="link-danger" id="m-del">删除</button>':''}<div class="spacer"></div>
      <button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-save">保存</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;

  // seg 通用选择
  overlay.querySelectorAll(".seg").forEach(seg=>{
    if(seg.id==="f-plat"){
      // 平台多选
      seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        o.classList.toggle("on");
      });
    } else {
      seg.querySelectorAll(".opt").forEach(o=>o.onclick=()=>{
        seg.querySelectorAll(".opt").forEach(x=>x.classList.remove("on"));
        o.classList.add("on");
        // 如果选了主题，清空自定义
        if(seg.id==="f-topic"){
          const custom=overlay.querySelector("#f-topic-custom");
          if(custom) custom.value=o.dataset.v;
        }
      });
    }
  });

  // 脚本绑定
  let boundScriptId = d.scriptId;
  overlay.querySelectorAll("[data-bind-id]").forEach(el=>el.onclick=()=>{
    const sid=+el.dataset.bindId;
    if(boundScriptId===sid){
      boundScriptId=null;
      el.classList.remove("bound");
      el.querySelector('span:last-child')?.remove();
    } else {
      overlay.querySelectorAll("[data-bind-id]").forEach(x=>{
        x.classList.remove("bound");
        const tag=x.querySelector('span:last-child');
        if(tag&&tag.textContent.includes('已绑定')) tag.remove();
      });
      boundScriptId=sid;
      el.classList.add("bound");
      el.insertAdjacentHTML('beforeend','<span style="color:var(--accent);font-size:11px">✓ 已绑定</span>');
      // 自动填充摘要
      const script=(data.script||[]).find(s=>s.id===sid);
      if(script){
        const summaryEl=overlay.querySelector("#f-summary");
        if(summaryEl && !summaryEl.value.trim()){
          // 提取脚本前120字作为摘要
          const content=script.content||"";
          summaryEl.value=content.slice(0,120)+(content.length>120?"...":"");
        }
      }
    }
  });

  if(editing) overlay.querySelector("#m-del").onclick=()=>{ close(); confirmSchedDelete(d.id); };

  overlay.querySelector("#m-save").onclick=()=>{
    const val=id=>{ const el=overlay.querySelector(id); return el?el.value:undefined; };
    const segVal=id=>{ const el=overlay.querySelector(id+" .on"); return el?el.dataset.v:undefined; };
    const plats=[]; overlay.querySelectorAll("#f-plat .on").forEach(o=>plats.push(o.dataset.v));

    const oldStatus = editing ? (data.schedule||[]).find(x=>x.id===d.id)?.status : null;

    // 主题：优先自定义输入，否则选标签
    const customTopic=(val("#f-topic-custom")||"").trim();
    const selTopic=segVal("#f-topic");
    d.topic = customTopic || selTopic || "未命名";
    d.date = val("#f-date") || isoToday();
    d.status = segVal("#f-status") || "edit";
    d.platforms = plats.length?plats:["抖音"];
    d.summary = (val("#f-summary")||"").trim();
    d.scriptId = boundScriptId;

    // 分析数据
    if(d.status==="pub"){
      d.analytics = {
        views: +val("#f-views")||0,
        completionRate: +val("#f-completionRate")||0,
        likes: +val("#f-likes")||0,
        comments: +val("#f-comments")||0,
        shares: +val("#f-shares")||0,
        collects: +val("#f-collects")||0,
        dms: +val("#f-dms")||0,
        leads: +val("#f-leads")||0,
        cardSold: +val("#f-cardSold")||0,
        courseSold: +val("#f-courseSold")||0,
      };
    }

    if(!editing){
      data.schedule = data.schedule||[];
      data.schedule.unshift(d);
    } else {
      const idx = data.schedule.findIndex(x=>x.id===d.id);
      if(idx>=0) data.schedule[idx] = d;
    }

    // 状态变为「已发布」时自动创建账号分析记录
    if(d.status==="pub" && oldStatus!=="pub"){
      autoCreateAnalytics(d);
    }

    persist(); close();
  };
}

function confirmSchedDelete(id){
  const t=(data.schedule||[]).find(x=>x.id==id); if(!t) return;
  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:400px"><h3>删除排期任务</h3><div class="sub">确定删除「${esc(t.topic||'此任务')}」？此操作不可撤销。</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="c-cancel">取消</button><button class="btn danger" id="c-ok">删除</button></div></div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#c-cancel").onclick=close;
  overlay.querySelector("#c-ok").onclick=()=>{ data.schedule=data.schedule.filter(x=>x.id!=id); persist(); close(); };
}

/* 排期→账号分析：状态改为已发布时自动创建分析记录 */
function autoCreateAnalytics(task){
  data.analytics = data.analytics || [];
  const a = task.analytics || {};
  const plat = (task.platforms||[])[0] || "抖音";
  const moodMap = {"抖音":"抖音分析","B站":"B站分析","小红书":"小红书分析"};
  const content = `视频标题：${task.topic||''}\n发布日期：${task.date||''}\n平台：${plat}\n\n【数据表现】\n播放量：${a.views||0}\n完播率：${a.completionRate||0}%\n点赞：${a.likes||0}\n评论：${a.comments||0}\n分享：${a.shares||0}\n收藏：${a.collects||0}\n\n【转化数据】\n私信咨询：${a.dms||0}\n线索转化：${a.leads||0}\n健身卡成交：${a.cardSold||0}\n课程成交：${a.courseSold||0}\n\n【来源】排期任务自动创建（任务ID: ${task.id}）`;

  data.analytics.unshift({
    id: Date.now(),
    title: task.topic || "未命名视频",
    mood: moodMap[plat] || "综合复盘",
    date: isoToday(),
    content,
    platform: plat,
    videoTitle: task.topic || "",
    publishDate: task.date || "",
    views: String(a.views||0),
    completionRate: String(a.completionRate||0),
    likes: String(a.likes||0),
    comments: String(a.comments||0),
    shares: String(a.shares||0),
    collects: String(a.collects||0),
    dms: String(a.dms||0),
    leads: String(a.leads||0),
    cardSold: String(a.cardSold||0),
    courseSold: String(a.courseSold||0),
    analysis: "",
    pinned: false,
  });
  showToast("已自动创建账号分析记录");
}

/* ---------- 排期建议（规则匹配） ---------- */
function aiSuggestDates(){
  const tasks = data.schedule||[];
  const scripts = data.script||[];
  // 找出有脚本但没排期的待安排脚本
  const scheduledIds = new Set(tasks.filter(t=>t.scriptId).map(t=>t.scriptId));
  const unscheduled = scripts.filter(s=>!scheduledIds.has(s.id));

  // 计算建议日期：从明天开始，每隔1-2天安排一条
  const suggestions = [];
  const now = new Date();
  let dayOffset = 1;
  unscheduled.slice(0,5).forEach(s=>{
    const d = new Date(now); d.setDate(now.getDate()+dayOffset);
    // 周末建议发抖音/小红书，工作日建议发B站
    const dow = d.getDay();
    const isWeekend = dow===0||dow===6;
    const platforms = isWeekend?["抖音","小红书"]:["B站","抖音"];
    suggestions.push({
      date: schedDateISO(d),
      topic: s.title||"未命名",
      platforms,
      status: "edit",
      scriptId: s.id,
      summary: (s.content||"").slice(0,100),
    });
    dayOffset += isWeekend?2:1;
  });

  if(!suggestions.length){
    const overlay=document.createElement("div"); overlay.className="overlay";
    overlay.innerHTML=`<div class="modal" style="width:420px"><h3>排期建议</h3><div class="sub">当前所有脚本均已排期，暂无需要建议的发布日期。可在「脚本生成」模块创建新脚本后再使用此功能。</div>
      <div class="modal-actions"><div class="spacer"></div><button class="btn" id="ok">知道了</button></div></div>`;
    document.body.appendChild(overlay);
    overlay.onclick=e=>{ if(e.target===overlay) overlay.remove(); };
    overlay.querySelector("#ok").onclick=()=>overlay.remove();
    return;
  }

  // 生成预览
  const rows = suggestions.map(s=>{
    const d = new Date(s.date+"T00:00:00");
    const dow = "日一二三四五六"[d.getDay()];
    const plats = s.platforms.join(" / ");
    return `<div style="padding:10px 0;border-bottom:1px solid var(--border)">
      <div style="font-weight:700;font-size:13px;margin-bottom:4px">${esc(s.topic)}</div>
      <div style="font-size:12px;color:var(--text-secondary)">📅 ${d.getMonth()+1}月${d.getDate()}日 周${dow} · 📱 ${plats}</div>
    </div>`;
  }).join("");

  const overlay=document.createElement("div"); overlay.className="overlay";
  overlay.innerHTML=`<div class="modal" style="width:480px">
    <h3>排期建议</h3>
    <div class="sub">基于未排期脚本，自动推荐发布日期和平台。周末侧重抖音/小红书，工作日侧重B站。</div>
    <div style="margin:12px 0">${rows}</div>
    <div class="modal-actions"><div class="spacer"></div><button class="btn ghost" id="m-cancel">取消</button><button class="btn" id="m-apply">全部添加到排期</button></div>
  </div>`;
  document.body.appendChild(overlay);
  const close=()=>overlay.remove();
  overlay.onclick=e=>{ if(e.target===overlay) close(); };
  overlay.querySelector("#m-cancel").onclick=close;
  overlay.querySelector("#m-apply").onclick=()=>{
    suggestions.forEach(s=>{
      data.schedule = data.schedule||[];
      data.schedule.unshift({...s, id: Date.now()+Math.random()});
    });
    persist(); close();
  };
}

function setTheme(theme) {
  document.documentElement.setAttribute('data-theme', theme);
  try { localStorage.setItem('gym-theme', theme); } catch(e) {}
}

buildNav();
render();
